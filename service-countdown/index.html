<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הספירה — ספירה לאחור לשירות</title>
<meta name="description" content="ספירה לאחור לשחרור ולכל אבן דרך בשירות — סוף קורס, כומתה, רגילה. עם ציר שירות ואחוז פז&quot;מ. עובד אופליין, הנתונים במכשיר בלבד.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<!-- Inline favicon: an external /favicon.ico request is the one network call
     the page was still making, and this tool promises zero. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0a33c' stroke-width='2' stroke-linecap='round'%3E%3Cpath d='M12 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z'/%3E%3Cpath d='M12 10v4l2 2'/%3E%3Cpath d='M9 2h6'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הספירה">
<meta name="theme-color" content="#13140f" id="metaTheme">
<style>
:root{
  --bg:#f2f1ea; --card:#fbfaf5; --ink:#1c1e16; --muted:#6b7061;
  --line:#e0ded2; --line-strong:#d0cebf; --accent:#8a5a12;
  --ease:cubic-bezier(.16,1,.3,1); --r:16px;
  --shadow:0 1px 2px rgba(28,30,22,.05), 0 8px 24px rgba(28,30,22,.06);
}
:root[data-theme="dark"]{
  --bg:#13140f; --card:#1c1e15; --ink:#edefe1; --muted:#9aa08c;
  --line:#2c2f23; --line-strong:#3a3d2e; --accent:#e0a33c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
/* A closed set, all from the collection's muted family. The default stays
   amber -- it is the tool's identity on the landing page. */
:root[data-accent="olive"]  { --accent:#4b5320 }
:root[data-accent="maroon"] { --accent:#7a3b32 }
:root[data-accent="steel"]  { --accent:#3d6b6b }
:root[data-accent="navy"]   { --accent:#3d4a6b }
:root[data-theme="dark"][data-accent="olive"]  { --accent:#b3c256 }
:root[data-theme="dark"][data-accent="maroon"] { --accent:#d98878 }
:root[data-theme="dark"][data-accent="steel"]  { --accent:#5f9a9a }
:root[data-theme="dark"][data-accent="navy"]   { --accent:#8593c4 }
/* 44px, not 36: these are the last sub-target buttons left in the tool, and
   five of them sit in one row a thumb-width apart. Five 44px circles plus the
   row gap still fit inside 320px. */
.swatch{width:44px; height:44px; border-radius:50%; border:2px solid var(--line-strong);
  cursor:pointer; padding:0}
.swatch.on{border-color:var(--ink); box-shadow:0 0 0 3px color-mix(in srgb, var(--ink) 15%, transparent)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;margin:0}

/* ---- hero: one full viewport, one number ---- */
.hero{
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:.5rem; text-align:center;
  padding:calc(1.5rem + env(safe-area-inset-top)) calc(1.5rem + env(safe-area-inset-right))
          calc(1.5rem + env(safe-area-inset-bottom)) calc(1.5rem + env(safe-area-inset-left));
}
.hero{
  --t:0;                                    /* 0 = full hero, 1 = collapsed */
  transform:scale(calc(1 - var(--t) * .35));
  opacity:calc(1 - var(--t) * .55);
  transform-origin:top center;
  will-change:transform, opacity;
}
.hero-label{color:var(--muted); font-size:1rem; letter-spacing:.02em}
.hero-num{
  font-size:clamp(4rem, 16vw, 8.5rem); font-weight:800; line-height:.9;
  letter-spacing:-.05em; color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.hero-num{background:none; border:0; padding:0; font-family:inherit; cursor:pointer;
  display:block; margin-inline:auto}
.hero-num:focus-visible{outline:2px solid var(--accent); outline-offset:6px; border-radius:8px}
.hero-unit{font-size:1.25rem; font-weight:800; color:var(--ink)}
.hero-meta{color:var(--muted); font-size:.95rem; margin-top:.75rem}
/* Was .hero-meta at opacity .6 -- an effective rgb(100,104,90) on #13140f,
   3.28:1 at 12.8px. This is the line that teaches both hidden gestures, so it
   is the last line that may be hard to read. */
.hero-hint{color:var(--muted); font-size:.85rem; margin-top:.75rem; max-width:22rem}
.hero-wrap{position:relative; display:grid; place-items:center; margin-block:.25rem}
/* The ringed wrap is sized explicitly so it can act as a query container:
   container-type also applies inline-size containment, which collapses an
   auto-width box to nothing. */
.hero-wrap.has-ring{width:min(78vw, 340px); container-type:inline-size}
.hero-ring{display:block; width:100%; height:auto; overflow:visible}
.hero-ring circle{fill:none; stroke-linecap:round;
  transform:rotate(-90deg); transform-origin:50% 50%}
.hero-ring .track{stroke:var(--line); stroke-width:3}
.hero-ring .fill{stroke:var(--accent); stroke-width:3;
  transition:stroke-dashoffset .9s var(--ease)}
.hero-wrap>.hero-inner{display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:.15rem}
/* Only the ringed hero stacks its text on top of the circle. Without a ring
   nothing else is in flow, so an absolutely positioned .hero-inner left the
   wrap at 0x0 and the number, unit and date piled onto each other. */
.hero-wrap.has-ring>.hero-inner{position:absolute; inset:0; padding:12%}
/* Sized against the ring, not the viewport. The ring stops growing at 340px
   while a vw-based number keeps going, so past that width a four-digit count
   (a 36-month service is over 1000 days) grew wider than the circle it was
   supposed to sit inside and struck the stroke on both sides. */
.hero-wrap.has-ring>.hero-inner .hero-num{font-size:min(26cqw, 8.5rem)}
@media (prefers-reduced-motion: reduce){ .hero-ring .fill{transition:none} }
.scroll-hint{margin-top:2rem; color:var(--muted); opacity:.7}
.scroll-hint svg{width:24px;height:24px}
.hero-num{transition:color .3s var(--ease)}
@keyframes roll{
  from{transform:translateY(.35em); opacity:0}
  to{transform:none; opacity:1}
}
.rolling{animation:roll .45s var(--ease)}
.moment{display:inline-flex; align-items:center; gap:.5rem; margin-top:.9rem;
  padding:.5rem .8rem; border-radius:999px; font-size:.88rem; font-weight:700;
  color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--card));
  border:1px solid color-mix(in srgb, var(--accent) 26%, transparent)}
.moment .ico{width:16px; height:16px}
@keyframes celebrate{
  0%{filter:none} 35%{filter:drop-shadow(0 0 14px var(--accent))} 100%{filter:none}
}
.celebrate{animation:celebrate 1.1s var(--ease)}

/* ---- shared ---- */
.ico{display:inline-flex; width:20px; height:20px}
.ico svg{width:100%;height:100%}
.chip-ico{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:38px; border-radius:12px; color:var(--accent);
  background:color-mix(in srgb, var(--accent) 12%, var(--card));
  border:1px solid color-mix(in srgb, var(--accent) 24%, transparent);
}
.chip-ico svg{width:20px;height:20px}
/* ---- timeline + event strip ---- */
.panel{padding:1.25rem; max-width:640px; margin-inline:auto}
.panel:last-of-type{padding-block-end:calc(1.25rem + env(safe-area-inset-bottom))}
.panel h2{font-size:1.15rem; margin-bottom:.9rem}
.tl{position:relative; padding-inline-start:1.25rem; margin:0;
  border-inline-start:2px solid var(--line); list-style:none}
.tl-fill{position:absolute; inset-block-start:0; inset-inline-start:-2px; width:2px;
  background:var(--accent); border-radius:2px}
.tl-node{position:relative; color:var(--muted); font-size:.9rem}
.tl-node::before{content:""; position:absolute; inset-inline-start:-1.6rem; top:.2rem;
  width:9px; height:9px; border-radius:50%; background:var(--line-strong)}
.tl-node.ev-node::before{background:transparent;
  border:2px solid color-mix(in srgb, var(--accent) 60%, var(--line-strong))}
.tl-node.done::before{background:var(--accent)}
.tl-node.now{color:var(--ink); font-weight:800}
.tl-node.now::before{background:var(--accent); box-shadow:0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent)}
.stats{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:.6rem}
.stat{padding:.9rem; border-radius:var(--r); background:var(--card);
  border:1px solid var(--line); box-shadow:var(--shadow)}
.stat-n{font-size:1.6rem; font-weight:800; color:var(--accent);
  font-variant-numeric:tabular-nums; line-height:1.1}
.stat-l{color:var(--muted); font-size:.85rem; margin-top:.2rem}
/* One dot per day of service. auto-fill with a minimum keeps the row count
   sane from 320px to 640px without a media query, and aspect-ratio keeps the
   dots round however many land in a row. */
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(7px, 1fr));
  gap:3px; padding:.9rem; border-radius:var(--r);
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow)}
.pgrid i{display:block; aspect-ratio:1}
.pgrid-legend{display:flex; flex-wrap:wrap; gap:.9rem; margin-top:.7rem;
  color:var(--muted); font-size:.8rem}
.pgrid-legend span{display:inline-flex; align-items:center; gap:.35rem}
.pgrid-legend i{width:8px; height:8px; flex:none; display:inline-block}
/* The swatch colours are shared by the grid and its legend. Scoping them to
   .pgrid alone left the legend swatches transparent -- the legend is a sibling
   of the grid, not a child. The event state is `mark`, NOT `ev`: `.ev` is the
   event ROW from the list below, and its padding/border/cursor leaked into the
   dots and blew them up to 29px, tearing the grid into blocks. */
.pgrid i, .pgrid-legend i{border-radius:50%;
  background:var(--line-strong); opacity:.55}
.pgrid i.done, .pgrid-legend i.done{background:var(--accent); opacity:.85}
.pgrid i.mark, .pgrid-legend i.mark{background:var(--accent); opacity:1}
.pgrid i.now, .pgrid-legend i.now{background:var(--ink); opacity:1}
.pgrid i.mark{box-shadow:0 0 0 1.5px color-mix(in srgb, var(--accent) 35%, transparent)}
.pgrid i.now{box-shadow:0 0 0 2.5px color-mix(in srgb, var(--ink) 25%, transparent)}
/* Grid, not wrapping flex: at 320px the three flex children could not share a
   row, so the icon sat alone on line 1, the text on line 2 and the count on
   line 3. The grid keeps the icon and title on one row and lets only the count
   drop, which is the one thing that may. */
.ev{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:.25rem .7rem;
  align-items:center; width:100%; text-align:start;
  padding:.85rem; border-radius:var(--r);
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  color:inherit; font:inherit; cursor:pointer;
  transition:transform .18s var(--ease), border-color .18s var(--ease)}
.ev:hover{transform:translateY(-1px); border-color:var(--line-strong)}
.ev:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.ev.soon{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
/* Title and date are block-level inside their own column: as inline spans they
   wrapped mid-phrase at 320px ("סוף / טירונות", "10 / ביוני / 2025"). */
.ev-grow{display:flex; flex-direction:column; gap:.15rem; min-width:0}
/* .ev-grow is also the "אירועים" heading in the section header, where it used
   to carry the flex:1 that pushed "הוסף אירוע" to the far edge. Inside .ev the
   grid column handles growth, so the flex only belongs in the header row. */
.row>.ev-grow{flex:1 1 auto}
.ev-t{font-weight:800; overflow-wrap:anywhere}
.ev-d{color:var(--muted); font-size:.85rem}
.ev-days{font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums;
  white-space:nowrap; justify-self:end}
/* Under ~360px the count moves to its own full-width row instead of squeezing
   the title into two characters per line. */
@media (max-width: 359px){
  .ev{grid-template-columns:auto minmax(0,1fr)}
  .ev-days{grid-column:1 / -1; justify-self:start; padding-inline-start:calc(38px + .7rem)}
}
.sheet{position:fixed; inset:0; z-index:30; background:var(--bg); overflow-y:auto;
  padding:calc(1.25rem + env(safe-area-inset-top)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:.9rem}
.sheet label{display:block; color:var(--muted); font-size:.9rem; margin-bottom:.35rem}
.tpl{display:flex; flex-wrap:wrap; gap:.45rem}
/* min-height, not padding: the chips were 34px tall, and v4 adds new ones for
   relative event dates and for postponing a release. 44px is the floor the
   plan sets for every new touch target, and the chips are the densest row in
   the tool -- two of them sit a thumb-width apart. */
.tpl button{min-height:44px; display:inline-flex; align-items:center;
  padding:.5rem .85rem; border-radius:999px; border:1px solid var(--line-strong);
  background:var(--card); color:var(--ink); font:inherit; font-size:.9rem; cursor:pointer}
.tpl button.on{background:var(--accent); border-color:var(--accent); color:var(--bg)}
#icons button{width:44px; height:44px; display:inline-flex; align-items:center;
  justify-content:center; padding:0}
#icons svg{width:20px;height:20px}
.sheet input[type=text],.sheet input[type=date]{
  width:100%; padding:.85rem; border-radius:var(--r); font-size:1rem; font-family:inherit;
  background:var(--card); color:var(--ink); border:1px solid var(--line-strong)}
.wizard input[type=number],.sheet input[type=number]{
  width:5.5rem; padding:.85rem; border-radius:var(--r);
  font-size:1rem; font-family:inherit; text-align:center;
  background:var(--card); color:var(--ink); border:1px solid var(--line-strong)}
.sheet-x{position:absolute; inset-block-start:calc(.9rem + env(safe-area-inset-top));
  inset-inline-end:.9rem; width:40px; height:40px; display:inline-flex;
  align-items:center; justify-content:center; border-radius:12px; cursor:pointer;
  background:transparent; border:1px solid var(--line); color:var(--muted); font:inherit;
  transform:rotate(45deg)}
.sheet-x svg{width:20px;height:20px}
.sheet-x:hover{color:var(--ink); border-color:var(--line-strong)}
.sheet.live{justify-content:center; align-items:center}
.live-body{display:flex; flex-direction:column; align-items:center; gap:1rem;
  text-align:center; width:100%}
/* Explicit width, because the cells below are query containers and so carry no
   intrinsic width of their own -- left to size from content the whole row
   collapsed to a sliver. */
.live-grid{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:.6rem;
  width:100%; max-width:26rem; margin-inline:auto}
/* min-width:4rem fought the minmax(0,1fr) tracks and forced the row wider than
   a 320px sheet; the digits then measured against the viewport rather than the
   cell, so a four-digit day count spilled onto its neighbour. Each cell is now
   its own query container and the number is sized against it. */
.live-cell{padding:.8rem .35rem; border-radius:var(--r);
  background:var(--card); border:1px solid var(--line); container-type:inline-size}
.live-num{font-size:min(30cqw, 2.6rem); font-weight:800; color:var(--accent);
  font-variant-numeric:tabular-nums; line-height:1}
.live-lab{color:var(--muted); font-size:.8rem; margin-top:.3rem}

/* ---- top bar + row actions ---- */
/* One fixed layer, not two. The old .topbar and .hero-mini were both
   position:fixed on the same row and fought over it: the title was drawn
   UNDER the buttons, and at 320px it had 96px for text that needs 129px. */
.appbar{
  position:fixed; inset-block-start:0; inset-inline:0; z-index:10;
  display:flex; align-items:center; gap:.5rem;
  padding:calc(.7rem + env(safe-area-inset-top)) calc(.9rem + env(safe-area-inset-right))
          .7rem calc(.9rem + env(safe-area-inset-left));
  background:transparent; border-block-end:1px solid transparent;
  transition:background .2s var(--ease), border-color .2s var(--ease);
}
.appbar.on{
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-block-end-color:var(--line);
}
.appbar-title{
  flex:1 1 auto; min-width:0; font-weight:800; font-size:.95rem;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  opacity:0; transform:translateY(-.4rem); pointer-events:none;
  transition:opacity .2s var(--ease), transform .2s var(--ease);
}
.appbar.on .appbar-title{opacity:1; transform:none}
.appbar-title b{color:var(--accent); font-variant-numeric:tabular-nums}
.appbar-title em{font-style:normal; color:var(--muted); font-weight:400}
.appbar-actions{display:flex; gap:.4rem; flex:0 0 auto}
/* Anything scrolled to must clear the bar. */
html{scroll-padding-block-start:5rem}
.panel h2{scroll-margin-block-start:5rem}
.iconbtn{width:44px; height:44px; display:inline-flex; align-items:center;
  justify-content:center; border-radius:12px; cursor:pointer; font:inherit;
  background:color-mix(in srgb, var(--card) 80%, transparent);
  border:1px solid var(--line); color:var(--ink);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.iconbtn svg{width:20px;height:20px}
.ev-del{flex:none; width:44px; height:44px; display:inline-flex; align-items:center;
  justify-content:center; border-radius:12px; border:1px solid transparent;
  background:transparent; color:var(--muted); cursor:pointer; font:inherit; opacity:.65;
  transition:opacity .18s var(--ease), border-color .18s var(--ease)}
.ev-del:hover,.ev-del:focus-visible{opacity:1; border-color:var(--line-strong); color:var(--ink)}
.ev-del svg{width:18px;height:18px}
/* The actions used to sit outside the card, flush to the screen edge, ~120px
   away from the row they act on. They now hug it. */
.ev-row{display:flex; align-items:stretch; gap:.35rem}
.ev-row .ev{flex:1 1 auto; min-width:0}
.ev-row+.ev-row{margin-top:.6rem}
.ev-actions{display:flex; flex-direction:column; justify-content:center; gap:.2rem;
  flex:0 0 auto}
.ev-past{margin-block-start:1.1rem}
.ev-past>summary{
  list-style:none; cursor:pointer; color:var(--muted); font-size:.9rem;
  font-weight:700; padding:.7rem .2rem; display:flex; align-items:center; gap:.4rem;
  min-height:44px;
}
.ev-past>summary::-webkit-details-marker{display:none}
.ev-past>summary .ico{width:16px; height:16px; transition:transform .18s var(--ease)}
.ev-past[open]>summary .ico{transform:rotate(180deg)}
.ev-past .ev{opacity:.72}
.toast{position:fixed; inset-inline:1rem; z-index:40;
  inset-block-end:calc(1rem + env(safe-area-inset-bottom));
  display:flex; align-items:center; gap:.75rem; padding:.85rem 1rem;
  border-radius:var(--r); background:var(--card); color:var(--ink);
  border:1px solid var(--line-strong); box-shadow:var(--shadow);
  animation:toast-in .25s var(--ease)}
.toast span{flex:1; min-width:0; font-size:.95rem}
.toast button{background:transparent; border:0; padding:.2rem .1rem; font:inherit;
  font-weight:800; color:var(--accent); cursor:pointer}
@keyframes toast-in{from{transform:translateY(1rem); opacity:0} to{transform:none; opacity:1}}

/* ---- onboarding wizard ---- */
.wizard{position:fixed; inset:0; z-index:20; background:var(--bg); overflow-y:auto;
  display:flex; flex-direction:column; justify-content:center; gap:1rem;
  padding:calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom))}
.wizard h2{font-size:1.5rem}
.wizard label{display:block; color:var(--muted); font-size:.9rem; margin-bottom:.35rem}
.wizard input[type=date]{
  width:100%; padding:.85rem; border-radius:var(--r); font-size:1rem;
  background:var(--card); color:var(--ink); border:1px solid var(--line-strong);
  font-family:inherit;
}
.row{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap}
.btn{padding:.8rem 1.1rem; border-radius:var(--r); border:1px solid var(--line-strong);
  background:var(--card); color:var(--ink); font:inherit; font-weight:700; cursor:pointer}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--bg)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--muted)}
.btn.danger{color:#c0392b; border-color:color-mix(in srgb, #c0392b 35%, var(--line))}
:root[data-theme="dark"] .btn.danger{color:#ff8a75;
  border-color:color-mix(in srgb, #ff8a75 30%, var(--line))}
.sheet h3{font-size:.9rem; font-weight:800; color:var(--muted);
  letter-spacing:.02em; margin:.6rem 0 -.3rem}
.sheet hr{border:0; border-block-start:1px solid var(--line); margin:.4rem 0}
.err{color:#c0392b; font-size:.9rem; min-height:1.2em}
:root[data-theme="dark"] .err{color:#ff8a75}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<main id="app">
<header class="appbar" id="appbar">
  <div class="appbar-title" id="heroMini" aria-hidden="true"></div>
  <div class="appbar-actions">
    <a class="iconbtn" href="../" aria-label="חזרה לאוסף הכלים" id="btnHome"></a>
    <button class="iconbtn" id="btnTheme" type="button" aria-label="החלף מצב תצוגה" aria-pressed="true"></button>
    <button class="iconbtn" id="btnSettings" type="button" aria-label="הגדרות"></button>
  </div>
</header>
  <section class="hero" id="hero"></section>
  <section class="panel" id="timeline"></section>
  <section class="panel" id="stats"></section>
  <section class="panel" id="grid"></section>
  <section class="panel" id="events"></section>
</main>
<script>
/* ---------- dates: pure date arithmetic, no DOM, no storage ---------- */
const dates = (() => {
  const MS_DAY = 86400000;
  const MONTHS_HE = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני',
                     'יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  // "YYYY-MM-DD" -> Date at LOCAL midnight.
  // Never use new Date(iso): that parses as UTC and shifts the calendar day
  // in any negative-offset timezone.
  function parse(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function toISO(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function todayISO() { return toISO(new Date()); }

  // Whole calendar days between two local dates.
  // Rounds rather than floors: a DST boundary makes a calendar day 23 or 25
  // hours long, and flooring the raw millisecond difference is off by one
  // across those days -- directly wrong in the headline number.
  function daysBetween(fromISO, toISOStr) {
    return Math.round((parse(toISOStr) - parse(fromISO)) / MS_DAY);
  }

  // Add n calendar days. Built through the Date constructor rather than by
  // adding n * MS_DAY: a DST boundary would leave the result at 01:00 or at
  // 23:00 of the previous day, and the previous-day case reports a date that
  // is off by one.
  function addDays(iso, n) {
    const d = parse(iso);
    return toISO(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n));
  }

  // Add n months, clamping onto the last day of the target month.
  // Naive JS overflows: 31 March + 1 month lands on 1 May.
  function addMonths(iso, n) {
    const d = parse(iso);
    const day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last));
    return toISO(t);
  }

  // Milliseconds from `now` to the next local midnight. Built through the Date
  // constructor for the same reason addDays is: on a DST night the distance to
  // midnight is 23 or 25 hours, and a hardcoded 86400000 drifts the daily
  // re-render by an hour in each direction.
  function msUntilNextMidnight(now) {
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    return next - now;
  }

  // 0..100, clamped. An empty or inverted range reads as finished.
  function progressPct(startISO, endISO, nowISO) {
    const total = daysBetween(startISO, endISO);
    if (total <= 0) return 100;
    const done = daysBetween(startISO, nowISO);
    return Math.max(0, Math.min(100, Math.round((done / total) * 100)));
  }

  // Whole calendar months. Walks the calendar rather than dividing days by 30:
  // 32 months of service is not 960 days, and the headline may not disagree
  // with the release date printed under it.
  function monthsBetween(fromISO, toISO) {
    const a = parse(fromISO), b = parse(toISO);
    let m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
    if (b.getDate() < a.getDate()) m -= 1;
    return m;
  }

  function unitValue(unit, fromISO, toISO) {
    if (unit === 'weeks')  return Math.trunc(Math.abs(daysBetween(fromISO, toISO)) / 7);
    if (unit === 'months') return Math.abs(monthsBetween(fromISO, toISO));
    return Math.abs(daysBetween(fromISO, toISO));
  }

  function unitName(unit, n) {
    const a = Math.abs(n);
    if (unit === 'weeks')  return a === 1 ? 'שבוע'  : a === 2 ? 'שבועיים'  : 'שבועות';
    if (unit === 'months') return a === 1 ? 'חודש'  : a === 2 ? 'חודשיים' : 'חודשים';
    return a === 1 ? 'יום' : a === 2 ? 'יומיים' : 'ימים';
  }

  // "15 חודשים" alone hides a week; this is the tail the unit rounded away.
  function remainderLabel(unit, fromISO, toISO) {
    if (unit === 'days') return '';
    const [a, b] = daysBetween(fromISO, toISO) < 0 ? [toISO, fromISO] : [fromISO, toISO];
    let rest;
    if (unit === 'months') rest = daysBetween(addMonths(a, monthsBetween(a, b)), b);
    else                   rest = Math.abs(daysBetween(a, b)) % 7;
    if (rest === 0) return '';
    return rest === 2 ? 'ויומיים' : `ו-${rest} ${unitName('days', rest)}`;
  }

  // Israeli conscription runs in waves; typing an enlistment date two years
  // back through a native date spinner is the slowest possible way in.
  // Months are 0-based here: 2 = March, 7 = August, 10 = November.
  function enlistWaves(todayISO, count) {
    const t = parse(todayISO);
    const out = [];
    let y = t.getFullYear();
    while (out.length < count && y > t.getFullYear() - 12) {
      for (const m of [10, 7, 2]) {
        const iso = toISO(new Date(y, m, 1));
        if (iso <= todayISO && out.length < count) out.push(iso);
      }
      y -= 1;
    }
    return out;
  }

  // Vertical distance between two nodes on the service axis. The old timeline
  // spaced nodes evenly and then drew a fill at `pct%` of the LIST's pixel
  // height -- so the fill and the "you are here" marker agreed only by
  // coincidence. Spacing by elapsed time makes the axis mean something, and the
  // floor keeps two same-week milestones from colliding.
  function axisGap(prevISO, dateISO, spanDays, pxTotal, minPx) {
    if (spanDays <= 0) return minPx;
    const d = daysBetween(prevISO, dateISO);
    if (d <= 0) return minPx;
    return Math.max(minPx, Math.round((d / spanDays) * pxTotal));
  }

  // Inclusive count of one weekday in a range, by arithmetic rather than by
  // walking a thousand days one Date at a time.
  function countWeekday(fromISO, toISO, dow) {
    const total = daysBetween(fromISO, toISO) + 1;
    if (total <= 0) return 0;
    const offset = (dow - parse(fromISO).getDay() + 7) % 7;
    if (offset >= total) return 0;
    return Math.floor((total - offset - 1) / 7) + 1;
  }

  // Distance to local midnight that starts the target day. Negative once the
  // day has begun -- the live screen shows the elapsed time instead.
  function msUntilDate(iso, now) {
    return parse(iso) - now;
  }

  // Absolute breakdown: the sign is the caller's business, since "3 days since"
  // and "3 days until" render identically apart from their label.
  function splitDuration(ms) {
    let s = Math.floor(Math.abs(ms) / 1000);
    const days = Math.floor(s / 86400); s -= days * 86400;
    const hours = Math.floor(s / 3600); s -= hours * 3600;
    const minutes = Math.floor(s / 60);
    return { days, hours, minutes, seconds: s - minutes * 60 };
  }

  // The next date in a fixed-day cycle at or after `todayISO`. Built on addDays
  // so a cycle that crosses a DST boundary keeps landing on the same weekday.
  function nextOccurrence(startISO, everyDays, todayISO) {
    if (!everyDays || everyDays <= 0) return startISO;
    const behind = daysBetween(startISO, todayISO);
    if (behind <= 0) return startISO;
    return addDays(startISO, Math.ceil(behind / everyDays) * everyDays);
  }

  // How many times a fixed cycle lands inside [fromISO, toISO], inclusive.
  // Built on nextOccurrence so a cycle crossing a DST boundary keeps its
  // weekday, and on daysBetween so the span is calendar days, not milliseconds.
  function occurrencesUntil(startISO, everyDays, fromISO, toISO) {
    if (!everyDays || everyDays <= 0) return 0;
    const span = daysBetween(fromISO, toISO);
    if (span < 0) return 0;
    const first = nextOccurrence(startISO, everyDays, fromISO);
    const reach = daysBetween(first, toISO);
    if (reach < 0) return 0;
    return Math.floor(reach / everyDays) + 1;
  }

  // The three moments people actually count toward. Returns the most advanced
  // one that has already happened, or null when there is nothing to say --
  // a banner that is always on stops being a banner.
  function momentFor(enlistISO, releaseISO, todayISO) {
    const left = daysBetween(todayISO, releaseISO);
    if (left < 0) return null;
    if (left <= 100) {
      // Through remainingLabel, not a hardcoded "נשארו": the verb has to agree
      // with the count, and on the last day the phrase is "היום!" entirely.
      return { key: 'last100', text: `100 הימים האחרונים — ${remainingLabel(left)}` };
    }
    const pct = progressPct(enlistISO, releaseISO, todayISO);
    if (pct >= 50) {
      return { key: 'half', text: 'עברת את חצי הפז״מ — נשאר לך פחות ממה שכבר עשית' };
    }
    return null;
  }

  function hebrewDays(n) {
    const a = Math.abs(n);
    if (a === 0) return 'היום';
    if (a === 1) return 'יום אחד';
    if (a === 2) return 'יומיים';
    return `${a} ימים`;
  }

  function remainingLabel(n) {
    if (n === 0) return 'היום!';
    if (n < 0) return `עברו ${hebrewDays(n)}`;
    return `${n === 1 ? 'נשאר' : 'נשארו'} ${hebrewDays(n)}`;
  }

  function formatHe(iso) {
    const d = parse(iso);
    return `${d.getDate()} ב${MONTHS_HE[d.getMonth()]} ${d.getFullYear()}`;
  }

  return { parse, toISO, todayISO, daysBetween, addDays, addMonths, msUntilNextMidnight,
           monthsBetween, unitValue, unitName, remainderLabel, enlistWaves, axisGap,
           countWeekday, msUntilDate, splitDuration, nextOccurrence, occurrencesUntil,
           momentFor,
           progressPct, hebrewDays, remainingLabel, formatHe };
})();
</script>

<script>
/* ---------- store: localStorage persistence, no DOM ---------- */
const store = (() => {
  const KEY = 'service-countdown.v1';

  function blank() {
    return { v: 1, profile: null, events: [], heroId: 'release', theme: 'dark', unit: 'days',
             accent: 'amber', seenMoment: null };
  }

  // Never throws. A corrupt or foreign payload is treated as "no data yet"
  // rather than breaking the page on open.
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return blank();
      const s = JSON.parse(raw);
      if (!s || typeof s !== 'object' || s.v !== 1) return blank();
      return Object.assign(blank(), s);
    } catch (e) {
      return blank();
    }
  }

  // Returns false when storage is unavailable (private mode, quota full) so
  // the caller can warn that nothing will persist.
  function save(state) {
    try { localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }

  // Release is NOT a row in `events`: it is derived from the profile so that
  // one date drives the headline, the timeline and the percentage alike.
  function releaseEvent(state) {
    if (!state.profile || !state.profile.releaseDate) return null;
    return { id: 'release', title: 'שחרור', date: state.profile.releaseDate,
             icon: 'party-popper', source: 'profile', virtual: true };
  }

  // A repeating event is stored once and rolled forward for display. Mutating
  // the stored date on every open would rewrite history and break undo.
  function allEvents(state, todayISO) {
    const today = todayISO || dates.todayISO();
    const list = state.events.map(e => {
      const row = Object.assign({ virtual: false }, e);
      if (e.every > 0) {
        row.baseDate = e.date;
        row.date = dates.nextOccurrence(e.date, e.every, today);
      }
      return row;
    });
    const rel = releaseEvent(state);
    if (rel) list.push(rel);
    return list.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  }

  // Falls back to the NEXT UPCOMING event, and only then to the most recent
  // past one. Falling back to list[0] (the earliest date) made a deleted hero
  // hand the main screen to an event that is long over -- the screen read
  // "סוף טירונות · 424 · ימים מאז", which is not what anyone opens this for.
  function heroEvent(state, todayISO) {
    const list = allEvents(state);
    if (list.length === 0) return null;
    const chosen = list.find(e => e.id === state.heroId);
    if (chosen) return chosen;
    const today = todayISO || dates.todayISO();
    return list.find(e => e.date >= today) || list[list.length - 1];
  }

  // Upcoming first, nearest first; the past goes into its own bucket, newest
  // first. allEvents sorts ascending, which for a soldier mid-service means
  // the screen opened on "425 days ago" -- the opposite of what a countdown is.
  function groupedEvents(state, todayISO) {
    const today = todayISO || dates.todayISO();
    const all = allEvents(state, today);
    return {
      upcoming: all.filter(e => e.date >= today),
      past: all.filter(e => e.date < today).reverse(),
    };
  }

  // Removal returns the row so the caller can offer an undo. Deleting a
  // milestone is one tap next to the row's own tap target; without an undo a
  // mis-tap is silent data loss, and there is no cloud copy to fall back on.
  function removeEvent(state, id) {
    const i = state.events.findIndex(e => e.id === id);
    if (i === -1) return null;
    return state.events.splice(i, 1)[0];
  }

  function restoreEvent(state, ev) {
    if (!ev || state.events.some(e => e.id === ev.id)) return false;
    state.events.push(ev);
    return true;
  }

  // A postponement is a fact about the service, not a correction of a typo:
  // it gets recorded, so the tool can say "your release moved by 30 days"
  // instead of quietly showing a different number than it did yesterday.
  function postponeRelease(state, newISO) {
    if (!state.profile || !newISO) return false;
    const prev = state.profile.releaseDate;
    if (!prev || newISO === prev) return false;
    state.profile.releaseDate = newISO;
    state.profile.history = (state.profile.history || []).concat({ from: prev, to: newISO });
    return true;
  }

  function postponedDays(state) {
    const h = (state.profile && state.profile.history) || [];
    return h.reduce((sum, m) => sum + dates.daysBetween(m.from, m.to), 0);
  }

  // The sheet used to accept any date at all: an event dated 1999 sat happily
  // in a 2025-2027 service and pushed the axis into nonsense.
  function validateEvent(state, draft) {
    const title = (draft.title || '').trim();
    if (!title || !draft.date) return 'צריך שם ותאריך';
    if (state.profile && draft.date < state.profile.enlistDate) {
      return 'התאריך מוקדם מתאריך הגיוס';
    }
    const clash = state.events.some(e =>
      e.id !== draft.id && e.title === title && e.date === draft.date);
    if (clash) return 'האירוע הזה כבר קיים';
    return '';
  }

  function exportJSON(state) { return JSON.stringify(state, null, 2); }

  function importJSON(text) {
    const s = JSON.parse(text);
    if (!s || typeof s !== 'object' || Array.isArray(s)) throw new Error('קובץ לא תקין');
    if (s.v !== 1) throw new Error('גרסת קובץ לא נתמכת');
    return Object.assign(blank(), s);
  }

  // base64url of the UTF-8 JSON. Not encryption and not claimed to be: the
  // payload is enlistment dates, and the link only ever leaves the device
  // because the user chose to send it.
  function encodeState(state) {
    const bytes = new TextEncoder().encode(JSON.stringify(state));
    let bin = '';
    for (const b of bytes) bin += String.fromCharCode(b);
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  function decodeState(text) {
    if (!text) throw new Error('קישור ריק');
    const b64 = text.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
    return importJSON(new TextDecoder().decode(bytes));
  }

  return { KEY, blank, load, save, allEvents, heroEvent, groupedEvents, removeEvent, restoreEvent,
           validateEvent, postponeRelease, postponedDays,
           exportJSON, importJSON, encodeState, decodeState };
})();
</script>

function icon(name) {
  const body = ICONS[name] || ICONS.flag;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}

function el(tag, attrs = {}, html = '') {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else n.setAttribute(k, v);
  }
  if (html) n.innerHTML = html;
  return n;
}

const TEMPLATES = [
  { title: 'שחרור',            icon: 'party-popper', profile: true },
  { title: 'סוף טירונות',      icon: 'shield' },
  { title: 'מסע כומתה',        icon: 'star' },
  { title: 'סוף אימון מתקדם',  icon: 'shield' },
  { title: 'סוף מסלול',        icon: 'flag' },
  { title: 'קורס מפקדים',      icon: 'graduation-cap' },
  { title: 'קורס קצינים',      icon: 'graduation-cap' },
  { title: 'דרגה חדשה',        icon: 'star' },
  { title: 'רגילה הבאה',       icon: 'home' },
  { title: 'הביתה',            icon: 'home' },
  { title: 'מילואים',       icon: 'shield' },
  { title: 'סוף מילואים',   icon: 'flag' },
];

const render = (() => {
  // Milestones derived from the profile. Not editable: they are a view of the
  // service, not user data.
  function milestones(p) {
    const total = dates.daysBetween(p.enlistDate, p.releaseDate);
    const at = frac => dates.addDays(p.enlistDate, Math.round(total * frac));
    const out = [
      { title: 'גיוס',        date: p.enlistDate },
      { title: 'רבע פז״מ',    date: at(.25) },
      { title: 'חצי פז״מ',    date: at(.5) },
      { title: 'שלושת רבעי',  date: at(.75) },
      { title: 'שחרור',       date: p.releaseDate },
    ];
    if (total > 365) out.push({ title: 'שנה בצבא', date: dates.addMonths(p.enlistDate, 12) });
    if (total > 730) out.push({ title: 'שנתיים',   date: dates.addMonths(p.enlistDate, 24) });
    if (total > 100) out.push({ title: '100 ימים אחרונים',
      date: dates.addDays(p.releaseDate, -100) });
    return out.sort((a, b) => (a.date < b.date ? -1 : 1));
  }

  // The hero is the only thing a unit switch changes; re-rendering the whole
  // page would also collapse the toast and reset the scroll position.
  let heroState = null, heroRefresh = null;
  function refreshHero() { if (heroState) hero(heroState, heroRefresh); }

  // A ring, not a bar: the spec drew one and a straight line under the number
  // reads as a loading indicator rather than as a share of a service.
  // r=46 in a 100-unit box leaves room for the 3-unit stroke at both ends.
  function ring(pct) {
    const R = 46, C = 2 * Math.PI * R;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'hero-ring');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('aria-hidden', 'true');
    for (const cls of ['track', 'fill']) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('class', cls);
      c.setAttribute('cx', '50'); c.setAttribute('cy', '50'); c.setAttribute('r', String(R));
      if (cls === 'fill') {
        c.setAttribute('stroke-dasharray', String(C));
        // Start empty, then let the CSS transition draw it on the next frame.
        c.setAttribute('stroke-dashoffset', String(C));
        requestAnimationFrame(() => requestAnimationFrame(() => {
          c.setAttribute('stroke-dashoffset', String(C * (1 - Math.min(100, pct) / 100)));
        }));
      }
      svg.append(c);
    }
    return svg;
  }

  function hero(state, refresh) {
    const host = document.getElementById('hero');
    heroState = state; heroRefresh = refresh;
    host.innerHTML = '';
    const ev = store.heroEvent(state);
    const mini = document.getElementById('heroMini');

    if (!ev) {
      mini.innerHTML = '';
      const start = el('button', { class: 'btn primary', type: 'button' }, 'הגדר תאריך שחרור');
      start.onclick = () => wizard(state, refresh);
      const add = el('button', { class: 'btn', type: 'button' }, 'הוסף אירוע');
      add.onclick = () => addSheet(state, refresh);
      const row = el('div', { class: 'row', style: 'justify-content:center' });
      row.append(start, add);
      host.append(
        el('div', { class: 'chip-ico' }, icon('plus')),
        el('h1', { class: 'hero-unit' }, 'עוד אין ספירה'),
        el('p', { class: 'hero-meta' }, 'התחילו מתאריך השחרור, או מכל אבן דרך אחרת'),
        row
      );
      return;
    }

    const today = dates.todayISO();
    const left = dates.daysBetween(today, ev.date);
    const past = left < 0;

    // "משוחרר" only fits the release. Any other event that has passed keeps
    // its own title, or the screen reads "discharged" for a beret march.
    host.append(el('div', { class: 'hero-label' },
      past && ev.id === 'release' ? 'משוחרר' : ev.title));
    const unit = state.unit || 'days';
    const value = dates.unitValue(unit, today, ev.date);
    const num = el('button', { class: 'hero-num', id: 'heroNum', type: 'button',
      'aria-live': 'polite', 'aria-label': 'החלף יחידת ספירה' }, String(value));
    num.onclick = () => {
      const order = ['days', 'weeks', 'months'];
      state.unit = order[(order.indexOf(unit) + 1) % order.length];
      store.save(state);
      refreshHero();
    };
    // Long press, not a second button: the hero screen earns its calm by
    // having exactly one thing on it.
    let holdTimer = null;
    const startHold = () => {
      holdTimer = setTimeout(() => { holdTimer = null; live.open(ev.title, ev.date); }, 550);
    };
    const cancelHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } };
    num.addEventListener('pointerdown', startHold);
    num.addEventListener('pointerup', cancelHold);
    num.addEventListener('pointerleave', cancelHold);
    num.addEventListener('contextmenu', e => e.preventDefault());
    const wrap = el('div', { class: 'hero-wrap' });
    const inner = el('div', { class: 'hero-inner' });
    inner.append(num);
    const rest = dates.remainderLabel(unit, today, ev.date);
    inner.append(el('div', { class: 'hero-unit' },
      past ? `${dates.unitName(unit, value)} מאז ${ev.title}`
           : (value === 0 && unit === 'days' ? 'היום!'
              : `${dates.unitName(unit, value)}${rest ? ' ' + rest : ''}`)));

    if (state.profile) {
      const pct = dates.progressPct(state.profile.enlistDate, state.profile.releaseDate, today);
      wrap.classList.add('has-ring');
      wrap.append(ring(pct));
      wrap.append(inner);
      host.append(wrap);
      host.append(el('div', { class: 'hero-meta' },
        `${dates.formatHe(ev.date)} · ${pct}% פז"מ`));
    } else {
      wrap.append(inner);
      host.append(wrap);
      host.append(el('div', { class: 'hero-meta' }, dates.formatHe(ev.date)));
    }

    if (state.profile) {
      const moment = dates.momentFor(state.profile.enlistDate, state.profile.releaseDate, today);
      if (moment) {
        const badgeEl = el('div', { class: 'moment' });
        badgeEl.append(el('span', { class: 'ico' }, icon('star')));
        badgeEl.append(el('span', {}, moment.text));
        host.append(badgeEl);
        // Celebrate once per moment, not on every render.
        if (state.seenMoment !== moment.key) {
          state.seenMoment = moment.key;
          store.save(state);
          motion.celebrate();
        }
      }
    }

    const moved = store.postponedDays(state);
    if (moved !== 0 && ev.id === 'release') {
      host.append(el('div', { class: 'hero-hint' },
        moved > 0 ? `השחרור נדחה ב-${dates.hebrewDays(moved)}`
                  : `השחרור הוקדם ב-${dates.hebrewDays(moved)}`));
    }

    // The tool followed this person for the whole service; when it is over it
    // owes them a closing line and exactly one next step, not a frozen screen.
    if (state.profile && ev.id === 'release' && past) {
      const servedAll = dates.daysBetween(state.profile.enlistDate, state.profile.releaseDate);
      host.append(el('div', { class: 'moment' },
        `סיימת ${dates.hebrewDays(servedAll)} של שירות`));
      const next = el('button', { class: 'btn', type: 'button' }, 'התחל ספירה למילואים');
      next.onclick = () => eventSheet(state, refresh);
      const row = el('div', { class: 'row', style: 'justify-content:center' });
      row.append(next);
      host.append(row);
    }

    const hintRow = el('div', { class: 'row', style: 'justify-content:center' });
    const liveBtn = el('button', { class: 'btn ghost', type: 'button' }, 'ספירה חיה');
    liveBtn.onclick = () => live.open(ev.title, ev.date);
    hintRow.append(liveBtn);
    host.append(hintRow);
    host.append(el('div', { class: 'hero-hint' }, 'לחיצה על המספר מחליפה יחידה'));

    host.append(el('div', { class: 'scroll-hint' }, icon('chevron-down')));

    // The sticky bar carries the same number AND the same unit the hero shows.
    // It was written before the unit switcher existed and reported raw days, so
    // scrolling turned "15 חודשים" into "464 ימים" and read like a second,
    // contradictory count.
    mini.innerHTML = past
      ? `${ev.title} · <b>${value}</b> <em>${dates.unitName(unit, value)} מאז</em>`
      : `${ev.title} · <b>${value}</b> <em>${value === 0 && unit === 'days'
          ? 'היום' : dates.unitName(unit, value)}</em>`;
  }

  function timeline(state) {
    const host = document.getElementById('timeline');
    host.innerHTML = '';
    if (!state.profile) return;                 // no profile -> no timeline

    const today = dates.todayISO();
    const p = state.profile;
    const pct = dates.progressPct(p.enlistDate, p.releaseDate, today);
    const span = dates.daysBetween(p.enlistDate, p.releaseDate);

    host.append(el('h2', {}, 'ציר השירות'));
    const tl = el('ol', { class: 'tl' });
    const fill = el('div', { class: 'tl-fill' });
    tl.append(fill);

    // Milestones, the user's own events, and "you are here" all live on one
    // axis: the spec asked for event points placed by date, and a separate
    // list of milestones was never the same thing.
    const nodes = milestones(p).map(n => ({ ...n, kind: 'milestone' }));
    for (const ev of store.allEvents(state)) {
      if (ev.id === 'release') continue;        // already a milestone
      nodes.push({ title: ev.title, date: ev.date, kind: 'event', icon: ev.icon });
    }
    nodes.push({ title: `אתה כאן · ${pct}%`, date: today, kind: 'now' });
    nodes.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

    let prev = nodes[0].date;
    let nowNode = null;
    for (const n of nodes) {
      const cls = n.kind === 'now' ? 'tl-node now'
                : n.date <= today ? 'tl-node done' : 'tl-node';
      const node = el('li', { class: cls + (n.kind === 'event' ? ' ev-node' : '') },
        n.kind === 'now' ? n.title : `${n.title} · ${dates.formatHe(n.date)}`);
      node.style.marginBlockStart = dates.axisGap(prev, n.date, span, 420, 14) + 'px';
      tl.append(node);
      if (n.kind === 'now') nowNode = node;
      prev = n.date;
    }

    host.append(tl);
    // Measured, not computed from a percentage: the fill now ends exactly at
    // the marker, whatever the dates are.
    if (nowNode) fill.style.height = (nowNode.offsetTop + 14) + 'px';
  }

  function stats(state) {
    const host = document.getElementById('stats');
    host.innerHTML = '';
    if (!state.profile) return;
    const p = state.profile, today = dates.todayISO();
    const served = Math.max(0, dates.daysBetween(p.enlistDate, today));
    const left = Math.max(0, dates.daysBetween(today, p.releaseDate));

    host.append(el('h2', {}, 'כמה כבר עשית'));
    const grid = el('div', { class: 'stats' });
    const pct = dates.progressPct(p.enlistDate, p.releaseDate, today);
    const rows = [
      ['ימים בשירות', String(served)],
      ['ימים שנשארו', String(left)],
      ['מהפז״מ מאחוריך', `${pct}%`],
    ];
    // The one number a soldier actually computes in their head, and no
    // competitor shows: how many times they still go home. Derived from the
    // user's own repeating event -- no assumption about their unit's cycle.
    const cycle = state.events.find(e => e.every > 0);
    if (cycle) {
      rows.push([`עוד ${cycle.title}`,
        String(dates.occurrencesUntil(cycle.date, cycle.every, today, p.releaseDate))]);
    } else {
      rows.push(['עוד שבתות', String(dates.countWeekday(today, p.releaseDate, 6))]);
    }
    for (const [label, value] of rows) {
      const cell = el('div', { class: 'stat' });
      cell.append(el('div', { class: 'stat-n' }, value));
      cell.append(el('div', { class: 'stat-l' }, label));
      grid.append(cell);
    }
    host.append(grid);
  }

  // 970-odd dots is a lot of nodes, but they are leaf <i> elements with no
  // listeners and the panel is rendered once per refresh -- cheaper than a
  // canvas that would have to be redrawn on every theme switch.
  function grid(state) {
    const host = document.getElementById('grid');
    host.innerHTML = '';
    if (!state.profile) return;
    const p = state.profile, today = dates.todayISO();
    const total = dates.daysBetween(p.enlistDate, p.releaseDate);
    if (total <= 0 || total > 4000) return;   // a nonsense range draws nothing

    const marks = new Set(store.allEvents(state).map(e => e.date));
    host.append(el('h2', {}, 'רשת הפז״מ'));
    const box = el('div', { class: 'pgrid', role: 'img',
      'aria-label': `רשת של ${total} ימי שירות, ${Math.max(0, dates.daysBetween(p.enlistDate, today))} מהם מאחוריך` });
    for (let i = 0; i <= total; i++) {
      const iso = dates.addDays(p.enlistDate, i);
      let cls = iso < today ? 'done' : '';
      if (marks.has(iso)) cls = 'mark';
      if (iso === today) cls = 'now';
      box.append(el('i', cls ? { class: cls } : {}));
    }
    host.append(box);
    const legend = el('div', { class: 'pgrid-legend' });
    for (const [cls, label] of [['done', 'נעשה'], ['now', 'היום'],
                                ['mark', 'אירוע'], ['', 'לפנינו']]) {
      const s = el('span', {});
      s.append(el('i', cls ? { class: cls } : {}), el('span', {}, label));
      legend.append(s);
    }
    host.append(legend);
  }

  let toastTimer = null;

  // One toast at a time: a second delete replaces the first, and the first
  // deletion is then final. Six seconds is long enough to notice and reach.
  function toast(message, actionLabel, onAction) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    if (toastTimer) clearTimeout(toastTimer);
    const box = el('div', { class: 'toast', role: 'status' });
    box.append(el('span', {}, message));
    const btn = el('button', { type: 'button' }, actionLabel);
    btn.onclick = () => { clearTimeout(toastTimer); box.remove(); onAction(); };
    box.append(btn);
    document.body.append(box);
    toastTimer = setTimeout(() => box.remove(), 6000);
  }

  function events(state, refresh) {
    const host = document.getElementById('events');
    host.innerHTML = '';
    const today = dates.todayISO();
    const { upcoming, past } = store.groupedEvents(state, today);
    const list = upcoming.concat(past);

    const head = el('div', { class: 'row' });
    head.append(el('h2', { class: 'ev-grow' }, 'אירועים'));
    const add = el('button', { class: 'btn', type: 'button' }, 'הוסף אירוע');
    add.onclick = () => addSheet(state, refresh);
    head.append(add);
    host.append(head);

    if (list.length === 0) {
      host.append(el('p', { class: 'ev-d' }, 'אין עדיין אירועים. הוסיפו אחד כדי להתחיל לספור.'));
      return;
    }

    // `row(ev)` is the exact body the old loop had; only the call sites moved.
    const buildRow = ev => {
      const left = dates.daysBetween(today, ev.date);
      const soon = left >= 0 && left <= 7;
      const row = el('button', { class: 'ev' + (soon ? ' soon' : ''), type: 'button' });
      row.append(el('span', { class: 'chip-ico' }, icon(ev.icon)));
      const mid = el('span', { class: 'ev-grow' });
      mid.append(el('span', { class: 'ev-t' }, ev.title));
      mid.append(el('span', { class: 'ev-d' }, dates.formatHe(ev.date)));
      if (ev.baseDate) {
        mid.append(el('span', { class: 'ev-d' },
          `חוזר כל ${dates.hebrewDays(state.events.find(x => x.id === ev.id).every)}`));
      }
      row.append(mid);
      row.append(el('span', { class: 'ev-days' }, dates.remainingLabel(left)));
      row.onclick = () => { state.heroId = ev.id; store.save(state); refresh();
        window.scrollTo({ top: 0, behavior: 'smooth' }); };

      const wrap = el('div', { class: 'ev-row' });
      wrap.append(row);
      if (!ev.virtual) {                       // release comes from the profile
        const edit = el('button', { class: 'ev-del', type: 'button',
          'aria-label': 'ערוך ' + ev.title }, icon('settings'));
        edit.onclick = () => eventSheet(state, refresh, state.events.find(x => x.id === ev.id));
        const del = el('button', { class: 'ev-del', type: 'button', 'aria-label': 'מחק ' + ev.title },
          icon('trash'));
        del.onclick = () => {
          const removed = store.removeEvent(state, ev.id);
          store.save(state);
          refresh();
          toast(`"${removed.title}" נמחק`, 'ביטול', () => {
            store.restoreEvent(state, removed);
            store.save(state);
            refresh();
          });
        };
        const actions = el('div', { class: 'ev-actions' });
        actions.append(edit, del);
        wrap.append(actions);
      }
      return wrap;
    };

    for (const ev of upcoming) host.append(buildRow(ev));

    if (past.length > 0) {
      const box = el('details', { class: 'ev-past' });
      const sum = el('summary', {});
      sum.append(el('span', { class: 'ico' }, icon('chevron-down')));
      sum.append(el('span', {}, `מה שכבר עבר · ${past.length}`));
      box.append(sum);
      for (const ev of past) box.append(buildRow(ev));
      host.append(box);
    }
  }

  // A full-screen overlay that ignores Escape, lets the page scroll behind it
  // and cannot be dismissed with the back gesture is not a sheet -- it is a
  // page that traps you. This wires all three, once, for every overlay.
  function openSheet(node, onClose) {
    const prevOverflow = document.body.style.overflow;
    const opener = document.activeElement;
    document.body.style.overflow = 'hidden';
    document.body.append(node);

    // aria-modal is a promise the DOM has to keep: without inert, Tab walks
    // straight out of the sheet into the page behind it (measured: escape on
    // the 15th Tab). `inert` also removes the background from the a11y tree.
    const app = document.getElementById('app');
    if (app) app.inert = true;

    const close = () => {
      if (!node.isConnected) return;
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('popstate', onPop);
      document.body.style.overflow = prevOverflow;
      node.remove();
      if (app) app.inert = false;
      if (opener && opener.focus) opener.focus();
      if (onClose) onClose();
      // Run the hand-off only now, once our own history entry is gone.
      if (after) { const fn = after; after = null; fn(); }
    };
    const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), ' +
                      'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); history.back(); return; }
      if (e.key !== 'Tab') return;
      const items = [...node.querySelectorAll(FOCUSABLE)]
        .filter(n => n.offsetParent !== null || n === document.activeElement);
      if (items.length === 0) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    const onPop = () => close();

    history.pushState({ sheet: true }, '');
    document.addEventListener('keydown', onKey);
    window.addEventListener('popstate', onPop);

    // Closing through history.back() keeps the browser's own back gesture and
    // our buttons on the same path, so the stack never drifts.
    //
    // A follow-up that opens ANOTHER sheet must be passed in here rather than
    // called after dismiss(). history.back() is asynchronous: a sheet opened
    // synchronously after it pushed its own entry BEFORE the pending traversal
    // fired, so the one popstate ran both listeners -- closing the new sheet in
    // the same tick it opened, and restoring the scroll lock it had captured
    // from the old one, which left the page permanently unscrollable.
    let after = null;
    const dismiss = fn => {
      if (!node.isConnected) return;
      if (typeof fn === 'function') after = fn;
      history.back();
    };

    const x = el('button', { class: 'sheet-x', type: 'button', 'aria-label': 'סגור' },
      icon('plus'));
    x.onclick = dismiss;
    node.prepend(x);

    const first = node.querySelector('input, button:not(.sheet-x)');
    if (first) first.focus();
    return dismiss;
  }

  const ICON_CHOICES = ['flag', 'shield', 'star', 'graduation-cap', 'home', 'party-popper'];

  function eventSheet(state, refresh, existing) {
    const box = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' });
    box.innerHTML = `
      <h2>${existing ? 'עריכת אירוע' : 'אירוע חדש'}</h2>
      <div class="tpl" id="tpl"></div>
      <div>
        <label for="aTitle">שם</label>
        <input type="text" id="aTitle" placeholder="למשל: סוף קורס מפקדים">
      </div>
      <div>
        <label for="aDate">תאריך</label>
        <input type="date" id="aDate">
        <div class="tpl" id="aDateQuick"></div>
      </div>
      <div>
        <label for="aEvery">חוזר כל</label>
        <div class="row">
          <input type="number" id="aEvery" min="0" max="365" step="1" value="0"
                 inputmode="numeric" aria-label="מספר ימים בין מופעים">
          <span class="ev-d">ימים · 0 = אירוע חד-פעמי</span>
        </div>
        <div class="tpl" id="aEveryQuick"></div>
      </div>
      <div>
        <label>אייקון</label>
        <div class="tpl" id="icons"></div>
      </div>
      <p class="err" id="aErr"></p>
      <div class="row">
        <button class="btn primary" id="aSave" type="button">${existing ? 'שמור' : 'הוסף'}</button>
        <button class="btn ghost" id="aCancel" type="button">ביטול</button>
      </div>`;
    const dismiss = openSheet(box);

    let pickedIcon = existing ? existing.icon : 'flag';
    let source = existing ? existing.source : 'custom';
    if (existing) {
      box.querySelector('#aTitle').value = existing.title;
      box.querySelector('#aDate').value = existing.date;
    }

    const every = box.querySelector('#aEvery');
    // Most things in the service are set relative to today, not read off a
    // calendar -- the wizard already learned this with the enlistment waves.
    const dateInput = box.querySelector('#aDate');
    const dateQuick = box.querySelector('#aDateQuick');
    for (const q of [{ n: 1, label: 'מחר' }, { n: 7, label: 'בעוד שבוע' },
                     { n: 14, label: 'בעוד שבועיים' }, { n: 30, label: 'בעוד חודש' },
                     { n: 100, label: 'בעוד 100 ימים' }]) {
      const b = el('button', { type: 'button' }, q.label);
      b.onclick = () => {
        dateQuick.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        dateInput.value = dates.addDays(dates.todayISO(), q.n);
      };
      dateQuick.append(b);
    }
    if (existing && existing.every) every.value = existing.every;
    const quick = box.querySelector('#aEveryQuick');
    for (const q of [{ n: 7, label: 'כל שבוע' }, { n: 14, label: 'כל שבועיים' },
                     { n: 21, label: 'כל 3 שבועות' }, { n: 28, label: 'כל 4 שבועות' }]) {
      const b = el('button', { type: 'button' }, q.label);
      b.onclick = () => {
        quick.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        every.value = q.n;
      };
      quick.append(b);
    }

    const icons = box.querySelector('#icons');
    function paintIcons() {
      icons.querySelectorAll('button').forEach(b =>
        b.classList.toggle('on', b.dataset.icon === pickedIcon));
    }
    for (const name of ICON_CHOICES) {
      const b = el('button', { type: 'button', 'aria-label': name, 'data-icon': name },
        icon(name));
      b.onclick = () => { pickedIcon = name; paintIcons(); };
      icons.append(b);
    }
    paintIcons();

    const tpl = box.querySelector('#tpl');
    for (const t of TEMPLATES) {
      const b = el('button', { type: 'button' }, t.title);
      b.onclick = () => {
        // "שחרור" is not an event: it is the profile. Creating it as a row
        // would give the tool two competing release dates. The wizard is handed
        // to dismiss so it opens only after this sheet's history entry popped --
        // see the note in openSheet.
        if (t.profile) { dismiss(() => wizard(state, refresh)); return; }
        tpl.querySelectorAll('button').forEach(x => x.classList.remove('on'));
        b.classList.add('on');
        pickedIcon = t.icon; source = 'template'; paintIcons();
        box.querySelector('#aTitle').value = t.title;
      };
      tpl.append(b);
    }

    box.querySelector('#aCancel').onclick = () => dismiss();
    box.querySelector('#aSave').onclick = () => {
      const draft = {
        id: existing ? existing.id : undefined,
        title: box.querySelector('#aTitle').value.trim(),
        date: box.querySelector('#aDate').value,
      };
      const problem = store.validateEvent(state, draft);
      if (problem) { box.querySelector('#aErr').textContent = problem; return; }
      const cycle = Math.max(0, Math.min(365, Number(every.value) || 0));
      if (existing) {
        Object.assign(existing, { title: draft.title, date: draft.date,
                                  icon: pickedIcon, every: cycle || null });
      } else {
        state.events.push({ id: 'e' + Date.now().toString(36), title: draft.title,
                            date: draft.date, icon: pickedIcon, source,
                            every: cycle || null });
      }
      store.save(state);
      dismiss();
      refresh();
    };
  }

  function postponeSheet(state, refresh) {
    const box = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true' });

  function wizard(state, onDone) {
    const box = el('div', { class: 'wizard', id: 'wizard', role: 'dialog', 'aria-modal': 'true' });
    box.innerHTML = `

        המחדל היא 24. אלה ברירות מחדל בלבד: המקור המחייב הוא התאריך שעל הצו,
        ואפשר לדרוס כאן הכול.</p>

    const dismiss = openSheet(box);

    const enlist = box.querySelector('#wEnlist');

    let gender = state.profile ? state.profile.gender : null;

    // Editing an existing profile: start from what is already stored.
    if (state.profile) {

    const months = box.querySelector('#wMonths');
    if (state.profile && state.profile.months) months.value = state.profile.months;

    const waves = box.querySelector('#wWaves');
    for (const iso of dates.enlistWaves(dates.todayISO(), 6)) {
      const b = el('button', { type: 'button' }, dates.formatHe(iso).replace(/^1 ב/, ''));
      b.onclick = () => {

    }

    const genderBox = box.querySelector('#wGender');
    function paintGender() {
      genderBox.querySelectorAll('button').forEach(b =>
        b.classList.toggle('on', b.dataset.g === gender));
    }
    for (const g of [{ g: 'm', label: 'חייל', months: 32 }, { g: 'f', label: 'חיילת', months: 24 }]) {
      const b = el('button', { type: 'button', 'data-g': g.g }, g.label);
      b.onclick = () => { gender = g.g; months.value = g.months; paintGender(); };
      genderBox.append(b);
    }
    paintGender();

    box.querySelector('#wCalc').onclick = () => {
      if (!enlist.value) { err.textContent = 'צריך קודם תאריך גיוס'; return; }
      const n = Number(months.value);
      if (!Number.isInteger(n) || n < 1 || n > 60) {
        err.textContent = 'מספר חודשים לא הגיוני'; return;
      }
      err.textContent = '';
      release.value = dates.addMonths(enlist.value, n);
    };

    box.querySelector('#wSave').onclick = () => {
      if (!enlist.value || !release.value) { err.textContent = 'צריך שני תאריכים'; return; }
      if (dates.daysBetween(enlist.value, release.value) <= 0) {
        err.textContent = 'תאריך השחרור חייב להיות אחרי הגיוס'; return;
      }
      state.profile = { enlistDate: enlist.value, releaseDate: release.value,
                        gender, months: Number(months.value) || null };
      state.heroId = 'release';
      if (!store.save(state)) err.textContent = 'שים לב: הנתונים לא יישמרו במכשיר הזה';
      dismiss();
      onDone();
    };

    box.querySelector('#wSkip').onclick = () => { dismiss(); onDone(); };
  }

  return { hero, ring, wizard, timeline, stats, grid, events, addSheet, eventSheet, settings,
           postponeSheet, toast, openSheet };
})();
