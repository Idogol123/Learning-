<script>
/* ---------- motion: scroll-driven hero collapse + digit roll ---------- */
const motion = (() => {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Deliberately NOT animation-timeline: scroll(). That is Chromium-only and
  // this tool's primary target is an installed PWA on iOS Safari, where it
  // would silently do nothing.
  function init() {
    // Reduced motion removes the collapse animation, not the sticky header:
    // the header is information, not decoration.
    const animate = !reduce;
    const hero = document.getElementById('hero');
    if (!hero) return;
    let ticking = false;
    const onScroll = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => {
        const t = Math.min(1, window.scrollY / (window.innerHeight * 0.6));
        if (animate) hero.style.setProperty('--t', t.toFixed(3));
        const bar = document.getElementById('appbar');
        const mini = document.getElementById('heroMini');
        if (bar) {
          const on = t > 0.72;
          bar.classList.toggle('on', on);
          if (mini) mini.setAttribute('aria-hidden', on ? 'false' : 'true');
        }
        ticking = false;
      });
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  function rollNumber() {
    if (reduce) return;
    const n = document.getElementById('heroNum');
    if (!n) return;
    n.classList.remove('rolling');
    void n.offsetWidth;             // force reflow so the animation restarts
    n.classList.add('rolling');
  }

  // A restrained pulse of the accent, not confetti: this collection does not
  // do party graphics, and reduced-motion users get nothing at all.
  function celebrate() {
    if (reduce) return;
    const el2 = document.querySelector('.hero-ring .fill') || document.getElementById('heroNum');
    if (!el2) return;
    el2.classList.remove('celebrate');
    void el2.getBoundingClientRect();
    el2.classList.add('celebrate');
    if (navigator.vibrate) { try { navigator.vibrate([12, 60, 12]); } catch (e) {} }
  }

  return { init, rollNumber, celebrate };
})();
</script>

<script>
/* ---------- clock: keeps the number honest without a reload ---------- */
const clock = (() => {
  let timer = null;
  let day = null;

  function schedule(onNewDay) {
    if (timer) clearTimeout(timer);
    // +1s of slack: firing a hair before midnight would compute the same day
    // again and reschedule in a tight loop.
    const ms = dates.msUntilNextMidnight(new Date()) + 1000;
    timer = setTimeout(() => tick(onNewDay), ms);
  }

  function tick(onNewDay) {
    const today = dates.todayISO();
    if (today !== day) { day = today; onNewDay(); }
    schedule(onNewDay);
  }

  // An installed PWA is suspended, not closed. Coming back to it after a day
  // in the background is the common case where the number on screen is a day
  // (or a week) stale -- which is the one thing a countdown may not do.
  function init(onNewDay) {
    day = dates.todayISO();
    schedule(onNewDay);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) tick(onNewDay);
    });
    window.addEventListener('pageshow', () => tick(onNewDay));
  }

  return { init };
})();
</script>

<script>
/* ---------- ics: a calendar file is the only offline path to a real reminder ---------- */
const ics = (() => {
  // A PWA cannot schedule a local notification without a push server. What it
  // CAN do is hand the OS calendar an event with an alarm attached -- Apple
  // Calendar and Google Calendar both honour VALARM -- so the reminder comes
  // from the system, with no server and no permission prompt.
  function esc(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;')
                    .replace(/,/g, '\\,').replace(/\n/g, '\\n');
  }

  function stamp(iso) { return iso.replace(/-/g, ''); }

  // A recurrence with no UNTIL is an infinite daily series in someone's real
  // calendar, and the caller has no release date to pass whenever the wizard
  // was dismissed. The bound lives here rather than in the caller because this
  // is the function that knows how to write an RRULE, and it has to be safe on
  // its own. Five years: longer than any conscript service or reserve cycle,
  // short enough that a 21-day cycle stays under a hundred rows.
  const FALLBACK_YEARS = 5;
  function boundedUntil(startISO, untilISO) {
    return untilISO || dates.addDays(startISO, FALLBACK_YEARS * 365);
  }

  function build(events, alarmDays, untilISO) {
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//hasfira//service-countdown//HE',
                   'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:הספירה'];
    let seq = 0;
    for (const ev of events) {
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:${stamp(ev.date)}-${seq++}@hasfira.local`);
      lines.push(`DTSTAMP:${stamp(dates.todayISO())}T000000Z`);
      // All-day events use an exclusive DTEND: the day after the event.
      lines.push(`DTSTART;VALUE=DATE:${stamp(ev.date)}`);
      lines.push(`DTEND;VALUE=DATE:${stamp(dates.addDays(ev.date, 1))}`);
      // A repeating event has to leave here as a recurrence, not as the single
      // rolled-forward occurrence the app happens to be showing today.
      if (ev.every > 0) {
        lines.push(`RRULE:FREQ=DAILY;INTERVAL=${ev.every}` +
                   `;UNTIL=${stamp(boundedUntil(ev.date, untilISO))}`);
      }
      lines.push(`SUMMARY:${esc(ev.title)}`);
      lines.push('TRANSP:TRANSPARENT');
      if (alarmDays > 0) {
        lines.push('BEGIN:VALARM');
        lines.push(`TRIGGER;RELATED=START:-P${alarmDays}D`);
        lines.push('ACTION:DISPLAY');
        lines.push(`DESCRIPTION:${esc(ev.title)}`);
        lines.push('END:VALARM');
      }
      lines.push('END:VEVENT');
    }
    lines.push('END:VCALENDAR');
    return lines.join('\r\n') + '\r\n';
  }

  // One all-day row per day, whose SUMMARY is the count itself. A PWA cannot
  // schedule a local notification -- Notification Triggers never shipped and
  // Web Push needs a server -- but the system calendar will happily show
  // "שחרור · נשארו 449 ימים" every morning, offline and with no permission.
  function countdownRows(title, targetISO, fromISO, days) {
    const rows = [];
    for (let i = 0; i < days; i++) {
      const day = dates.addDays(fromISO, i);
      const left = dates.daysBetween(day, targetISO);
      if (left < 0) break;
      rows.push({ title: `${title} · ${dates.remainingLabel(left)}`, date: day });
    }
    return rows;
  }

  function filename() { return 'ha-sfira.ics'; }

  return { build, countdownRows, filename };
})();

/* ---------- badge: the only "widget" a PWA gets ---------- */
const badge = (() => {
  // navigator.setAppBadge works on installed home-screen web apps from
  // iOS/iPadOS 16.4 and on Chrome/Edge, but only once notification permission
  // has been granted. It is the closest thing we have to the competitor's
  // home-screen widget: the days left, readable without opening anything.
  function supported() { return 'setAppBadge' in navigator; }

  function paint(n) {
    if (!supported()) return;
    if (typeof n === 'number' && n > 0) navigator.setAppBadge(n).catch(() => {});
    else navigator.clearAppBadge().catch(() => {});
  }

  async function enable() {
    if (!supported() || !('Notification' in window)) return false;
    try { return (await Notification.requestPermission()) === 'granted'; }
    catch (e) { return false; }
  }

  return { supported, paint, enable };
})();
</script>

<script>
/* ---------- card: a shareable image, drawn locally ---------- */
const card = (() => {
  const W = 1080, H = 1080;

  function palette(dark) {
    return dark
      ? { bg: '#13140f', card: '#1c1e15', ink: '#edefe1', muted: '#9aa08c',
          line: '#2c2f23', accent: '#e0a33c' }
      : { bg: '#f2f1ea', card: '#fbfaf5', ink: '#1c1e16', muted: '#6b7061',
          line: '#e0ded2', accent: '#8a5a12' };
  }

  function draw(opts) {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const p = palette(opts.dark);
    const font = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif';

    g.fillStyle = p.bg; g.fillRect(0, 0, W, H);
    g.fillStyle = p.card;
    g.strokeStyle = p.line; g.lineWidth = 3;
    g.beginPath(); g.roundRect(60, 60, W - 120, H - 120, 48); g.fill(); g.stroke();

    // Progress ring, same geometry as the app's hero ring.
    const cx = W / 2, cy = 470, r = 240;
    g.lineWidth = 18; g.lineCap = 'round';
    g.strokeStyle = p.line;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
    if (opts.pct > 0) {
      g.strokeStyle = p.accent;
      g.beginPath();
      g.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * opts.pct) / 100);
      g.stroke();
    }

    g.direction = 'rtl';
    g.textAlign = 'center';
    // The title sits ABOVE the ring, not across it. At cy-150 it was still
    // inside the circle's vertical span, where the drawable chord is only
    // ~370px wide -- "סוף קורס מפקדים מתקדם" ran straight through the stroke.
    g.fillStyle = p.muted;
    g.font = `600 44px ${font}`;
    g.fillText(opts.title, cx, cy - r - 40, W - 220);

    // maxWidth keeps the number and unit inside the ring's inner chord however
    // many digits they run to; a four-digit count at 200px is wider than the
    // circle it sits in.
    g.fillStyle = p.accent;
    g.font = `800 200px ${font}`;
    g.fillText(String(opts.value), cx, cy + 60, 2 * r - 100);

    g.fillStyle = p.ink;
    g.font = `800 56px ${font}`;
    g.fillText(opts.unit, cx, cy + 145, 2 * r - 100);

    g.fillStyle = p.muted;
    g.font = `400 38px ${font}`;
    g.fillText(opts.dateText, cx, 840);
    g.font = `700 34px ${font}`;
    g.fillStyle = p.accent;
    g.fillText('הספירה', cx, 940);
    return c;
  }

  function toBlob(canvas) {
    return new Promise(res => canvas.toBlob(res, 'image/png'));
  }

  async function share(state) {
    const ev = store.heroEvent(state);
    if (!ev) return;
    const today = dates.todayISO();
    const unit = state.unit || 'days';
    const value = dates.unitValue(unit, today, ev.date);
    const pct = state.profile
      ? dates.progressPct(state.profile.enlistDate, state.profile.releaseDate, today) : 0;
    const canvas = draw({
      title: ev.title, value, unit: dates.unitName(unit, value),
      dateText: dates.formatHe(ev.date), pct, dark: state.theme === 'dark',
    });
    const blob = await toBlob(canvas);
    const file = new File([blob], 'ha-sfira.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }
      catch (e) { return; }              // the user dismissed the share sheet
    }
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ha-sfira.png';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  return { draw, share };
})();

/* ---------- wallpaper: the closest a PWA gets to a lock-screen widget ---------- */
const wallpaper = (() => {
  // Same palette values as `card`, kept local because card does not export it.
  function palette(dark) {
    return dark
      ? { bg: '#13140f', ink: '#edefe1', muted: '#9aa08c', line: '#2c2f23', accent: '#e0a33c' }
      : { bg: '#f2f1ea', ink: '#1c1e16', muted: '#6b7061', line: '#e0ded2', accent: '#8a5a12' };
  }

  // iOS paints the clock across the top ~28% of the lock screen and the
  // shortcuts across the bottom ~12%. Everything we draw lives between them.
  function draw(opts) {
    const W = opts.w, H = opts.h;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const p = palette(opts.dark);
    const font = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Hebrew", Arial, sans-serif';

    g.fillStyle = p.bg; g.fillRect(0, 0, W, H);
    g.direction = 'rtl';
    g.textAlign = 'center';

    const cy = Math.round(H * 0.52);
    const r = Math.round(Math.min(W, H) * 0.26);
    g.lineWidth = Math.max(6, Math.round(W * 0.014));
    g.lineCap = 'round';
    g.strokeStyle = p.line;
    g.beginPath(); g.arc(W / 2, cy, r, 0, Math.PI * 2); g.stroke();
    if (opts.pct > 0) {
      g.strokeStyle = p.accent;
      g.beginPath();
      g.arc(W / 2, cy, r, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * opts.pct) / 100);
      g.stroke();
    }

    g.fillStyle = p.muted;
    g.font = `600 ${Math.round(W * 0.045)}px ${font}`;
    g.fillText(opts.title, W / 2, cy - r - Math.round(W * 0.05), W * 0.8);

    g.fillStyle = p.accent;
    g.font = `800 ${Math.round(W * 0.22)}px ${font}`;
    g.fillText(String(opts.value), W / 2, cy + Math.round(W * 0.07), 2 * r - W * 0.08);

    g.fillStyle = p.ink;
    g.font = `800 ${Math.round(W * 0.055)}px ${font}`;
    g.fillText(opts.unit, W / 2, cy + Math.round(W * 0.17), 2 * r - W * 0.08);

    g.fillStyle = p.muted;
    g.font = `400 ${Math.round(W * 0.035)}px ${font}`;
    g.fillText(opts.dateText, W / 2, Math.round(H * 0.84));
    return c;
  }

  function size() {
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const w = Math.round((window.screen.width || 390) * dpr);
    const h = Math.round((window.screen.height || 844) * dpr);
    // Guard against a desktop screen producing a 5120px-wide phone wallpaper.
    return { w: Math.min(w, 1600), h: Math.min(h, 3600) };
  }

  async function download(state) {
    const ev = store.heroEvent(state);
    if (!ev) return false;
    const today = dates.todayISO();
    const unit = state.unit || 'days';
    const value = dates.unitValue(unit, today, ev.date);
    const pct = state.profile
      ? dates.progressPct(state.profile.enlistDate, state.profile.releaseDate, today) : 0;
    const { w, h } = size();
    const canvas = draw({ w, h, title: ev.title, value, unit: dates.unitName(unit, value),
      dateText: dates.formatHe(ev.date), pct, dark: state.theme === 'dark' });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    const file = new File([blob], 'ha-sfira-wallpaper.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return true; }
      catch (e) { return true; }            // the user dismissed the share sheet
    }
    const a = el('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ha-sfira-wallpaper.png';
    a.click();
    URL.revokeObjectURL(a.href);
    return true;
  }

  return { draw, size, download };
})();
</script>

<script>
/* ---------- live: the seconds view, for the week when seconds matter ---------- */
const live = (() => {
  let raf = null, sentinel = null;

  async function lock() {
    // Screen Wake Lock so the phone can sit on a shelf counting down. Absent on
    // some browsers and revoked whenever the tab is backgrounded -- both are
    // fine, the view just dims with the screen.
    try {
      if ('wakeLock' in navigator) sentinel = await navigator.wakeLock.request('screen');
    } catch (e) { sentinel = null; }
  }

  function release() {
    if (sentinel) { sentinel.release().catch(() => {}); sentinel = null; }
  }

  function open(title, dateISO) {
    const box = el('div', { class: 'sheet live', role: 'dialog', 'aria-modal': 'true' });
    box.innerHTML = `
      <div class="live-body">
        <div class="hero-label" id="lvTitle"></div>
        <div class="live-grid" id="lvGrid"></div>
        <div class="hero-meta" id="lvDate"></div>
      </div>`;
    const dismiss = render.openSheet(box, () => {
      if (raf) cancelAnimationFrame(raf);
      raf = null;
      release();
    });
    box.querySelector('#lvTitle').textContent = title;
    box.querySelector('#lvDate').textContent = dates.formatHe(dateISO);
    const grid = box.querySelector('#lvGrid');

    const cells = [['days', 'ימים'], ['hours', 'שעות'], ['minutes', 'דקות'], ['seconds', 'שניות']]
      .map(([key, label]) => {
        const cell = el('div', { class: 'live-cell' });
        const n = el('div', { class: 'live-num' }, '0');
        cell.append(n, el('div', { class: 'live-lab' }, label));
        grid.append(cell);
        return { key, n };
      });

    let lastSecond = -1;
    function frame() {
      const ms = dates.msUntilDate(dateISO, new Date());
      const parts = dates.splitDuration(ms);
      // One DOM write per second, not per frame: rAF only exists here to stay
      // in step with the compositor and to stop cleanly when the sheet closes.
      if (parts.seconds !== lastSecond) {
        lastSecond = parts.seconds;
        for (const c of cells) c.n.textContent = String(parts[c.key]);
        box.querySelector('#lvTitle').textContent =
          ms < 0 ? `מאז ${title}` : title;
      }
      raf = requestAnimationFrame(frame);
    }
    frame();
    lock();
    return dismiss;
  }

  return { open };
})();
</script>

<script>
let state = store.load();

// An incoming transfer link never overwrites silently: this device may already
// hold a service someone is counting.
if (location.hash.startsWith('#t=')) {
  const code = location.hash.slice(3);
  history.replaceState(null, '', location.pathname);
  try {
    const incoming = store.decodeState(code);
    const hasData = state.profile || state.events.length > 0;
    if (!hasData || confirm('הקישור מכיל ספירה אחרת. להחליף את מה שיש במכשיר?')) {
      Object.assign(state, incoming);
      store.save(state);
    }
  } catch (e) { /* a broken link must not break the page */ }
}

const btnTheme = document.getElementById('btnTheme');
const btnSettings = document.getElementById('btnSettings');

function paintTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.documentElement.setAttribute('data-accent', state.accent || 'amber');
  btnTheme.innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon');
  btnTheme.setAttribute('aria-pressed', state.theme === 'dark' ? 'true' : 'false');
  // The tool picks its own theme regardless of the system setting, so a static
  // theme-color left a light page under a dark status bar.
  document.getElementById('metaTheme')
    .setAttribute('content', state.theme === 'dark' ? '#13140f' : '#f2f1ea');
}
btnTheme.onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  store.save(state);
  paintTheme();
};
btnSettings.innerHTML = icon('settings');
document.getElementById('btnHome').innerHTML = icon('home');
btnSettings.onclick = () => render.settings(state, refresh);
paintTheme();

function refresh() {
  // paintTheme is part of the refresh: a reset or an imported backup can
  // carry a different theme than the one currently on screen.
  paintTheme();
  render.hero(state, refresh);
  render.timeline(state);
  render.stats(state);
  render.grid(state);
  render.events(state, refresh);
  motion.rollNumber();
  // The badge always tracks the hero event, so the icon and the screen agree.
  const shown = store.heroEvent(state);
  badge.paint(shown ? dates.daysBetween(dates.todayISO(), shown.date) : null);
}

// Render first, then put the wizard on top of a drawn page. Now that a sheet
// can be dismissed with Escape or the back gesture, opening the wizard INSTEAD
// of rendering left whoever dismissed it staring at a blank screen with no way
// back except a reload. Behind it now sits the empty state, which offers both
// "set a release date" and "add an event".
refresh();

// Manifest shortcuts land on a hash. Handled after the first render, so the
// sheet always opens on top of a drawn page (the wizard bug of v2). A shortcut
// also suppresses the first-run wizard: two sheets open at once would leave
// #app un-inerted as soon as the top one closed, and the person who tapped
// "הוסף אירוע" asked for that sheet, not for the wizard.
const shortcut = location.hash === '#add' || location.hash === '#settings';
if (shortcut) {
  const open = location.hash === '#add' ? render.eventSheet : render.settings;
  history.replaceState(null, '', location.pathname);
  open(state, refresh);
}

if (!shortcut && !state.profile && state.events.length === 0) {
  render.wizard(state, refresh);
}

motion.init();
clock.init(refresh);

// The protocol guard matches the other tools: registering from file:// throws
// an unhandled rejection, which the headless quality gate reports as an error.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
