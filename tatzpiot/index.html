<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תצפיות — ליווי חניכים</title>
<meta name="description" content="תיעוד תצפיות התנהגותיות על חניכים, אפיון תופעות, שיחות משוב ומעקב שיפור. מוצפן, אופליין, הנתונים במכשיר בלבד.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<!-- Inline favicon: an external /favicon.ico request would be the one network
     call this tool makes, and it promises zero. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232c5d7c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0'/%3E%3Ccircle cx='12' cy='12' r='3'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="תצפיות">
<meta name="theme-color" content="#f2f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13140f" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<style>
:root{
  --bg:#f2f1ea; --card:#fbfaf5; --ink:#1c1e16; --muted:#6b7061;
  --line:#e0ded2; --line-strong:#d0cebf;
  --accent:#2c5d7c;
  /* Semantics are fixed and never reused for decoration:
     green = ⊕, orange = ⊖, red = "not observed" only. */
  --plus:#2f7d4f; --minus:#b85a10; --stale:#b42318;
  --ease:cubic-bezier(.16,1,.3,1);
  --r:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(28,30,22,.05), 0 8px 24px rgba(28,30,22,.06);
  --shadow-up:0 -1px 2px rgba(28,30,22,.04), 0 -8px 24px rgba(28,30,22,.06);
  --safe-b:env(safe-area-inset-bottom, 0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#13140f; --card:#1c1e15; --ink:#edefe1; --muted:#9aa08c;
    --line:#2c2f23; --line-strong:#3a3d2e;
    --accent:#6aa6cf;
    --plus:#4bbd7c; --minus:#f0954a; --stale:#f07167;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --shadow-up:0 -1px 2px rgba(0,0,0,.4), 0 -8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",Arial,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);
}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent)}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(104px + var(--safe-b))}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:15px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);margin:22px 2px 8px}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px}
.top-t{flex:1;min-width:0}
.top-t h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-t .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:44px;height:44px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.ibtn:active{background:var(--line)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card + .card{margin-top:10px}
.stack > * + *{margin-top:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap-ok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--line);margin:12px 0}

/* buttons */
.btn{min-height:44px;padding:10px 16px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--card);color:var(--ink);text-decoration:none;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#0d1a24}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--stale);border-color:color-mix(in srgb,var(--stale) 40%,transparent);background:transparent}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns > .btn{flex:1 1 auto}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);
  font-size:15px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme: dark){.chip[aria-pressed="true"]{color:#0d1a24}}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--stale)}
.chip.focus{border-style:dashed}
.chip.focus[aria-pressed="true"]{border-style:solid}
.chip.sm{min-height:32px;padding:4px 10px;font-size:13px}

/* valence */
.val{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.val button{min-height:56px;border-radius:var(--r-sm);border:1.5px solid var(--line-strong);background:var(--card);
  font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2}
.val button b{font-size:22px;line-height:1}
.val button[data-v="plus"]{color:var(--plus)}
.val button[data-v="minus"]{color:var(--minus)}
.val button[data-v="neutral"]{color:var(--muted)}
.val button[aria-pressed="true"][data-v="plus"]{background:color-mix(in srgb,var(--plus) 14%,var(--card));border-color:var(--plus)}
.val button[aria-pressed="true"][data-v="minus"]{background:color-mix(in srgb,var(--minus) 14%,var(--card));border-color:var(--minus)}
.val button[aria-pressed="true"][data-v="neutral"]{background:color-mix(in srgb,var(--muted) 14%,var(--card));border-color:var(--muted);color:var(--ink)}
.p{color:var(--plus);font-weight:700}
.m{color:var(--minus);font-weight:700}

/* forms */
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 6px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],textarea,select{
  width:100%;min-height:44px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--bg);padding:10px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.hint{font-size:13px;color:var(--minus);margin:6px 2px 0}
.err{font-size:14px;color:var(--stale);margin:8px 2px 0;font-weight:600}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:4px}
details.more > summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:6px;color:var(--accent);font-weight:700;font-size:15px}
details.more > summary::-webkit-details-marker{display:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid;font-size:14px;margin-top:12px}
.banner svg.i{margin-top:1px}
.banner.warn{background:color-mix(in srgb,var(--minus) 10%,var(--card));border-color:color-mix(in srgb,var(--minus) 30%,transparent)}
.banner.info{background:color-mix(in srgb,var(--accent) 9%,var(--card));border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.banner.alert{background:color-mix(in srgb,var(--stale) 9%,var(--card));border-color:color-mix(in srgb,var(--stale) 30%,transparent)}
.banner .grow > b{display:block}

/* attention queue */
.q{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q:last-child{padding-bottom:0}
.q .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 24%,transparent)}
.q .ico.o{color:var(--minus);background:color-mix(in srgb,var(--minus) 12%,var(--card));border-color:color-mix(in srgb,var(--minus) 24%,transparent)}
.q .ico.r{color:var(--stale);background:color-mix(in srgb,var(--stale) 10%,var(--card));border-color:color-mix(in srgb,var(--stale) 24%,transparent)}
.q .t{font-weight:700;font-size:15px}
.q .d{font-size:14px;color:var(--muted)}
.q .btns{margin-top:8px}

/* trainee list */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;border-top:1px solid var(--line);
  text-decoration:none;color:inherit;position:relative}
.li:first-child{border-top:0}
.li:active{background:var(--bg)}
.li .bar{position:absolute;inset-block:10px;right:0;width:4px;border-radius:4px 0 0 4px;background:transparent}
.li.stale .bar{background:var(--stale)}
.li .nm{font-weight:800;font-size:16px}
.li .meta{font-size:13px;color:var(--muted)}
.li.stale .when{color:var(--stale);font-weight:700}
.li .counts{display:flex;gap:10px;font-size:14px;align-items:center}
.li .chev{color:var(--muted)}
.cov{display:flex;align-items:center;gap:10px;font-size:14px}
.cov .track{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.cov .fill{height:100%;background:var(--accent);border-radius:99px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px -16px 0;padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 12px;border:0;background:none;font-weight:700;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap;text-decoration:none;display:flex;align-items:center}
.tab[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* stat strip */
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* phenomenon cards */
.ph{display:block;text-decoration:none;color:inherit}
.ph .k{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;display:inline-block}
.k.gap{color:var(--minus);background:color-mix(in srgb,var(--minus) 12%,var(--card))}
.k.strength{color:var(--plus);background:color-mix(in srgb,var(--plus) 12%,var(--card))}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line-strong);color:var(--muted);display:inline-block}
.ph .title{font-weight:800;font-size:16px;margin:6px 0 2px}
.prog{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px;flex-wrap:wrap}
.prog .arrow{color:var(--muted)}

/* competency table */
.ct{width:100%;border-collapse:collapse}
.ct td{padding:10px 4px;border-top:1px solid var(--line);font-size:15px;vertical-align:middle}
.ct tbody tr:first-child td{border-top:0}
.ct td.n{text-align:center;width:44px}
.ct td.tr{text-align:left;width:112px;font-size:13px;color:var(--muted);line-height:1.3}
.trend .was{display:block;font-weight:500;color:var(--muted);font-size:12px}
.trend{display:inline-flex;align-items:flex-start;gap:4px;font-weight:700;text-align:right}
.trend.up{color:var(--plus)} .trend.down{color:var(--minus)} .trend.flat{color:var(--muted)}
.ct tr[data-act]{cursor:pointer}
.ct th{font-size:12px;font-weight:700;color:var(--muted);padding:0 4px 6px;text-align:center}
.ct th:first-child{text-align:right}
.ct th:last-child{text-align:left}
.ct tr.none td:first-child{color:var(--muted)}

/* timeline */
.ev{padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0;padding-top:2px}
.ev .h{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ev .sym{font-size:18px;line-height:1}
.ev .b{margin-top:4px;font-size:15px}
.ev .x{font-size:14px;color:var(--muted);margin-top:2px}
.ev .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ev .acts{display:flex;gap:4px;margin-top:4px}
.ev.note .b{font-style:italic}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.ph{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}

/* text output */
pre.out{white-space:pre-wrap;font:inherit;font-size:15px;margin:0;line-height:1.6}

/* bottom nav */
.bnav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.bnav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;height:64px}
.bnav a,.bnav button.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;
  color:var(--muted);text-decoration:none;min-height:56px;background:none;border:0}
.bnav a[aria-current="true"]{color:var(--accent)}
.fab{justify-self:center;width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent);margin-top:-22px;
  transition:transform .15s var(--ease)}
@media (prefers-color-scheme: dark){.fab{color:#0d1a24}}
.fab:active{transform:scale(.95)}
.fab svg.i{width:28px;height:28px;stroke-width:2.4}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,12,8,.42);z-index:50;opacity:0;transition:opacity .25s var(--ease)}
.backdrop.on{opacity:1}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:51;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--card);border-radius:22px 22px 0 0;box-shadow:var(--shadow-up);transform:translateY(100%);transition:transform .32s var(--ease)}
.sheet.on{transform:none}
.sheet-in{max-width:640px;margin:0 auto;padding:6px 16px calc(20px + var(--safe-b))}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line-strong);margin:4px auto 6px}
.sheet-h{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:var(--card);z-index:2;padding:4px 0 8px}
.sheet-h h2{flex:1}
.sheet .save-bar{position:sticky;bottom:calc(-20px - var(--safe-b));background:var(--card);padding:12px 0 calc(12px + var(--safe-b));margin-bottom:calc(-20px - var(--safe-b));border-top:1px solid var(--line);margin-top:16px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s var(--ease);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* lock */
.lock{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + var(--safe-b))}
.lock .card{width:100%;max-width:420px;padding:22px}
.logo{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);margin-bottom:12px}
.logo svg.i{width:28px;height:28px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .btn{margin-top:12px}

/* round */
.round-card .who{font-size:26px;font-weight:800;letter-spacing:-.02em}
.progress-dots{display:flex;gap:4px;margin-top:8px}
.progress-dots i{flex:1;height:4px;border-radius:4px;background:var(--line)}
.progress-dots i.d{background:var(--accent)}
.progress-dots i.s{background:var(--line-strong)}
.progress-dots i.c{background:color-mix(in srgb,var(--accent) 45%,var(--line))}

/* settings rows */
.srow{display:flex;gap:8px;align-items:center;padding:6px 0}
.srow input[type=text]{min-height:40px;padding:8px 10px}
.srow .ibtn{width:40px;height:40px}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;inset:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-strong);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + span{background:var(--plus)}
.switch input:checked + span::after{transform:translateX(-20px)}
.insight{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);margin-top:6px}
.insight b{color:var(--accent)}

@media (max-width:360px){
  .val button{font-size:13px}
  .ct td.tr{width:96px}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ======================================================================
   logic — pure, deterministic functions over the data model.
   No DOM, no storage, no clock: callers pass `now`. Tested directly by
   tatzpiot/test/logic.test.mjs, which extracts THIS block from the page.
   ====================================================================== */
const logic = (() => {
  const DAY = 864e5;
  const WIN = 21;            // trend window, days
  const PATTERN_DAYS = 14;   // look-back for "this looks like a pattern"
  const PATTERN_MIN = 3;

  const DEFAULT_COMPETENCIES = [
    'פיקוד ושליטה', 'מקצועיות טנקיסטית', 'ניווט והתמצאות', 'קבלת החלטות תחת לחץ',
    'דוגמה אישית', 'עבודת צוות ויחסי אנוש', 'דיווח ותקשורת', 'למידה ויישום משוב',
  ];
  const DEFAULT_CONDITIONS = ['לילה', 'עייפות', 'לחץ זמן', 'אחרי מאמץ', 'בהובלה', 'מול מפקד'];
  const STATUS = { identified: 'זוהתה', discussed: 'נדונה בשיחה', working: 'בתהליך', resolved: 'הושגה' };
  const STATUS_ORDER = ['identified', 'discussed', 'working', 'resolved'];
  const KIND = { gap: 'לשיפור', strength: 'חוזקה' };

  const ts = x => (typeof x === 'number' ? x : x instanceof Date ? x.getTime() : parseISO(x));
  // 'YYYY-MM-DD' is a LOCAL calendar day; Date.parse would read it as UTC.
  function parseISO(s) {
    if (typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s)) {
      const [y, m, d] = s.split('-').map(Number);
      return new Date(y, m - 1, d).getTime();
    }
    return Date.parse(s);
  }
  const midnight = t => { const d = new Date(ts(t)); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
  // Calendar-day difference; rounding absorbs the 23/25-hour DST days.
  const calDays = (a, b) => Math.round((midnight(b) - midnight(a)) / DAY);
  const pad = n => String(n).padStart(2, '0');
  const ymd = t => { const d = new Date(ts(t)); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  const fmtD = t => { const d = new Date(ts(t)); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`; };
  const fmtDY = t => { const d = new Date(ts(t)); return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`; };
  const fmtT = t => { const d = new Date(ts(t)); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const sym = v => (v === 'plus' ? '⊕' : v === 'minus' ? '⊖' : '○');
  const tod = h => (h >= 5 && h < 12 ? 'בוקר' : h >= 12 && h < 17 ? 'צהריים' : h >= 17 && h < 21 ? 'ערב' : 'לילה');

  function normalize(d) {
    d = d || {};
    const s = d.settings || {};
    let i = 0;
    return {
      settings: {
        unitName: s.unitName || '',
        competencies: Array.isArray(s.competencies) && s.competencies.length
          ? s.competencies
          : DEFAULT_COMPETENCIES.map(name => ({ id: 'c' + (++i), name })),
        conditions: Array.isArray(s.conditions) ? s.conditions : DEFAULT_CONDITIONS.slice(),
        staleDays: Number(s.staleDays) > 0 ? Number(s.staleDays) : 5,
        bgLockSec: Number.isFinite(Number(s.bgLockSec)) && s.bgLockSec !== null && s.bgLockSec !== undefined ? Number(s.bgLockSec) : 60,
        lastBackupAt: s.lastBackupAt || null,
      },
      trainees: d.trainees || [],
      exercises: d.exercises || [],
      observations: (d.observations || []).map(o => ({ conditions: [], phenomenonIds: [], location: null, exerciseId: null, situation: '', impact: '', ...o })),
      phenomena: (d.phenomena || []).map(p => ({ statusLog: [], goal: '', ...p })),
      talks: d.talks || [],
      notes: d.notes || [],
      dismissedObs: d.dismissedObs || [],
    };
  }

  const compName = (S, id) => (S.settings.competencies.find(c => c.id === id) || {}).name || '—';
  const obsOf = (S, tid) => S.observations.filter(o => o.traineeId === tid);
  const byAtDesc = (a, b) => ts(b.at) - ts(a.at);
  const countPM = list => {
    let p = 0, m = 0, n = 0;
    for (const o of list) o.valence === 'plus' ? p++ : o.valence === 'minus' ? m++ : n++;
    return { p, m, n };
  };

  function stats(S, tid, now) {
    const list = obsOf(S, tid);
    const { p, m, n } = countPM(list);
    let last = null;
    for (const o of list) { const t = ts(o.at); if (last === null || t > last) last = t; }
    const daysSince = last === null ? null : calDays(last, now);
    return { count: list.length, plus: p, minus: m, neutral: n, last, daysSince,
             stale: last === null || daysSince > S.settings.staleDays };
  }

  // Least-recently-observed first; never-observed at the very top.
  function coverageOrder(S, now) {
    return S.trainees.filter(t => t.active !== false)
      .map(t => ({ t, s: stats(S, t.id, now) }))
      .sort((a, b) => {
        const la = a.s.last === null ? -Infinity : a.s.last;
        const lb = b.s.last === null ? -Infinity : b.s.last;
        if (la !== lb) return la < lb ? -1 : 1;
        return a.t.nickname.localeCompare(b.t.nickname, 'he');
      });
  }

  // ⊕ share among ⊕/⊖ in the last 21 days vs the 21 days before that.
  // Neutral observations carry no direction and are ignored. A direction is
  // only claimed with >=3 directional observations in EACH window.
  function trend(list, now) {
    const r = { p: 0, m: 0 }, q = { p: 0, m: 0 };
    for (const o of list) {
      if (o.valence !== 'plus' && o.valence !== 'minus') continue;
      const age = (now - ts(o.at)) / DAY;
      const b = age < WIN ? r : age < 2 * WIN ? q : null;
      if (!b) continue;
      o.valence === 'plus' ? b.p++ : b.m++;
    }
    const rn = r.p + r.m, qn = q.p + q.m;
    if (rn < 3 || qn < 3) return { dir: null, recent: r, prev: q };
    const delta = r.p / rn - q.p / qn;
    return { dir: delta >= 0.15 ? 'up' : delta <= -0.15 ? 'down' : 'flat', recent: r, prev: q, delta };
  }

  function competencyTable(S, tid, now) {
    const list = obsOf(S, tid);
    return S.settings.competencies.map(c => {
      const l = list.filter(o => o.competencyId === c.id);
      const { p, m } = countPM(l);
      return { c, n: l.length, plus: p, minus: m, trend: trend(l, now) };
    });
  }

  function biasWarnings(S, tid) {
    const list = obsOf(S, tid), out = [];
    const { p, m } = countPM(list);
    if (list.length >= 5 && ((p > 0 && m === 0) || (m > 0 && p === 0))) {
      out.push({ type: 'onesided', text: `כל ${list.length} התצפיות ${p ? '⊕' : '⊖'} — תמונה חד־צדדית, חפש גם את הצד השני` });
    }
    const comps = new Set(list.map(o => o.competencyId));
    if (list.length >= 4 && comps.size === 1) {
      out.push({ type: 'single', text: `כל התצפיות מכשירות אחת (${compName(S, list[0].competencyId)}) — הרחב את זווית הצפייה` });
    }
    return out;
  }

  // 3+ unlinked ⊖ (or ⊕) in one competency within 14 days = probably a
  // phenomenon nobody has named yet. If an open phenomenon of the same
  // competency+kind exists, suggest linking instead of creating a duplicate.
  function patternSuggestions(S, tid, now) {
    const dismissed = new Set(S.dismissedObs || []);
    const recent = obsOf(S, tid).filter(o =>
      (o.valence === 'plus' || o.valence === 'minus') &&
      (now - ts(o.at)) / DAY <= PATTERN_DAYS &&
      !(o.phenomenonIds || []).length);
    const groups = new Map();
    for (const o of recent) {
      const k = o.competencyId + '|' + o.valence;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(o);
    }
    const out = [];
    for (const [k, l] of groups) {
      if (l.length < PATTERN_MIN || l.every(o => dismissed.has(o.id))) continue;
      const [cid, val] = k.split('|');
      const kind = val === 'minus' ? 'gap' : 'strength';
      const existing = S.phenomena.find(p => p.traineeId === tid && p.competencyId === cid && p.kind === kind && p.status !== 'resolved');
      out.push({ traineeId: tid, competencyId: cid, kind, obsIds: l.sort(byAtDesc).map(o => o.id), existingId: existing ? existing.id : null });
    }
    return out;
  }

  // The moment a phenomenon left "identified" is when the trainee heard about
  // it. Everything in that competency before vs after = evidence of change.
  function phenomenonProgress(S, p) {
    const moved = (p.statusLog || []).find(x => x.status !== 'identified');
    if (!moved) return null;
    const cut = ts(moved.at);
    const before = { p: 0, m: 0 }, after = { p: 0, m: 0 };
    for (const o of obsOf(S, p.traineeId)) {
      if (o.competencyId !== p.competencyId || (o.valence !== 'plus' && o.valence !== 'minus')) continue;
      const b = ts(o.at) < cut ? before : after;
      o.valence === 'plus' ? b.p++ : b.m++;
    }
    return { since: moved.at, before, after };
  }

  // Where/when/under-what does this behaviour show up? Only shares that
  // actually say something (>=2 occurrences and >=50%) become insights.
  function breakdown(list) {
    const inc = (m, k) => m.set(k, (m.get(k) || 0) + 1);
    const cond = new Map(), loc = new Map(), tm = new Map();
    for (const o of list) {
      for (const c of o.conditions || []) inc(cond, c);
      if (o.location) inc(loc, o.location);
      inc(tm, tod(new Date(ts(o.at)).getHours()));
    }
    const n = list.length;
    const arr = m => [...m].sort((a, b) => b[1] - a[1]);
    const insights = [];
    if (n >= 2) {
      for (const [k, c] of arr(cond)) if (c >= 2 && c / n >= 0.5) insights.push({ kind: 'cond', label: k, c, n });
      for (const [k, c] of arr(tm)) if (c >= 2 && c / n >= 0.5) insights.push({ kind: 'tod', label: k, c, n });
      for (const [k, c] of arr(loc)) if (c >= 2 && c / n >= 0.5) insights.push({ kind: 'loc', label: k, c, n });
    }
    return { n, cond: arr(cond), loc: arr(loc), tod: arr(tm), insights };
  }

  function lastTalk(S, tid) {
    return S.talks.filter(k => k.traineeId === tid).sort(byAtDesc)[0] || null;
  }

  function dueFollowups(S, now) {
    const out = [];
    for (const t of S.trainees) {
      if (t.active === false) continue;
      const k = lastTalk(S, t.id);
      if (k && k.followUpAt && !k.followUpDone && ts(k.followUpAt) <= now) {
        out.push({ t, talk: k, overdue: calDays(k.followUpAt, now) });
      }
    }
    return out.sort((a, b) => b.overdue - a.overdue);
  }

  function attention(S, now) {
    const items = [];
    for (const f of dueFollowups(S, now)) items.push({ type: 'followup', prio: 1, ...f });
    for (const t of S.trainees) {
      if (t.active === false) continue;
      for (const s of patternSuggestions(S, t.id, now)) items.push({ type: 'pattern', prio: 2, t, s });
    }
    for (const t of S.trainees) {
      if (t.active === false) continue;
      for (const w of biasWarnings(S, t.id)) items.push({ type: 'bias', prio: 3, t, w });
    }
    return items.sort((a, b) => a.prio - b.prio);
  }

  function topComps(S, tid, val, n) {
    const m = new Map();
    for (const o of obsOf(S, tid)) {
      if (o.valence !== val) continue;
      if (!m.has(o.competencyId)) m.set(o.competencyId, []);
      m.get(o.competencyId).push(o);
    }
    return [...m].map(([cid, l]) => ({ cid, l: l.sort(byAtDesc) }))
      .sort((a, b) => b.l.length - a.l.length || ts(b.l[0].at) - ts(a.l[0].at))
      .slice(0, n);
  }

  function prepText(S, tid, now, opts) {
    const includePrivate = !!(opts && opts.includePrivate);
    const t = S.trainees.find(x => x.id === tid);
    if (!t) return '';
    const L = [`הכנה לשיחה — ${t.nickname}${t.team ? ` (${t.team})` : ''}`, fmtDY(now), ''];
    const obs = obsOf(S, tid);
    const last = lastTalk(S, tid);
    if (last) {
      L.push(`מהשיחה הקודמת (${fmtD(last.at)}):`);
      if (last.agreements) L.push(`סוכם: ${last.agreements}`);
      const phs = (last.phenomenonIds || []).map(id => S.phenomena.find(p => p.id === id)).filter(Boolean);
      if (phs.length) {
        const cids = new Set(phs.map(p => p.competencyId));
        const since = obs.filter(o => ts(o.at) > ts(last.at) && cids.has(o.competencyId)).sort(byAtDesc);
        const c = countPM(since);
        L.push(`מאז, באותן כשירויות: ⊕${c.p} ⊖${c.m}${since.length ? '' : ' — עוד לא נצפה. לבדוק לפני השיחה.'}`);
        for (const o of since.slice(0, 3)) L.push(`  ${fmtD(o.at)} ${sym(o.valence)} ${o.behavior}`);
      }
      L.push('');
    } else {
      L.push('שיחה ראשונה.', '');
    }
    const open = S.phenomena.filter(p => p.traineeId === tid && p.status !== 'resolved');
    if (open.length) {
      L.push('תופעות פתוחות:');
      for (const p of open) {
        L.push(`• [${KIND[p.kind]}] ${p.title} — ${STATUS[p.status]}`);
        if (p.goal) L.push(`  יעד: ${p.goal}`);
        const ev = obs.filter(o => (o.phenomenonIds || []).includes(p.id)).sort(byAtDesc)[0];
        if (ev) L.push(`  ראיה: ${fmtD(ev.at)} — ${ev.behavior}`);
      }
      L.push('');
    }
    const s = topComps(S, tid, 'plus', 2), g = topComps(S, tid, 'minus', 2);
    if (s.length) {
      L.push('חוזקות:');
      for (const x of s) {
        L.push(`• ${compName(S, x.cid)} (⊕${x.l.length})`);
        for (const o of x.l.slice(0, 2)) L.push(`  ${fmtD(o.at)} — ${o.behavior}`);
      }
      L.push('');
    }
    if (g.length) {
      L.push('נקודות לשיפור:');
      for (const x of g) {
        L.push(`• ${compName(S, x.cid)} (⊖${x.l.length})`);
        for (const o of x.l.slice(0, 2)) L.push(`  ${fmtD(o.at)} — ${o.behavior}`);
      }
      L.push('');
    }
    L.push('שאלות פתיחה:');
    if (last && last.agreements) L.push('• "מה עשית מאז השיחה הקודמת עם מה שסיכמנו?"');
    const ex = g[0] && g[0].l[0];
    if (ex) L.push(`• "אני רוצה לחזור ל-${fmtD(ex.at)}: ${ex.behavior}. איך אתה ראית את זה?"`);
    L.push('• "במה אתה מרגיש שהתקדמת, ובמה אתה עוד מתקשה?"');
    if (s[0]) L.push(`• "ב${compName(S, s[0].cid)} אתה חזק. איפה עוד זה יכול לשרת אותך?"`);
    const notes = S.notes.filter(n => n.traineeId === tid && (includePrivate || !n.private)).sort(byAtDesc).slice(0, 3);
    if (notes.length) {
      L.push('', 'הערות:');
      for (const n of notes) L.push(`• ${fmtD(n.at)} — ${n.text}${n.private ? ' (פרטי)' : ''}`);
    }
    return L.join('\n').trim();
  }

  function summaryText(S, tid, now) {
    const t = S.trainees.find(x => x.id === tid);
    if (!t) return '';
    const obs = obsOf(S, tid).sort((a, b) => ts(a.at) - ts(b.at));
    const talks = S.talks.filter(k => k.traineeId === tid);
    const L = [`סיכום חניכה — ${t.nickname}${t.team ? ` (${t.team})` : ''}`];
    if (obs.length) L.push(`${fmtDY(obs[0].at)}–${fmtDY(obs[obs.length - 1].at)} · ${obs.length} תצפיות · ${talks.length} שיחות משוב`);
    L.push('');
    const phs = S.phenomena.filter(p => p.traineeId === tid)
      .sort((a, b) => STATUS_ORDER.indexOf(b.status) - STATUS_ORDER.indexOf(a.status));
    if (phs.length) {
      L.push('מסלול התופעות:');
      for (const p of phs) {
        L.push(`• [${KIND[p.kind]}] ${p.title} — ${STATUS[p.status]} (מ-${fmtDY(p.createdAt)})`);
        const pr = phenomenonProgress(S, p);
        if (pr) L.push(`  לפני השיחה: ⊕${pr.before.p} ⊖${pr.before.m} · מאז: ⊕${pr.after.p} ⊖${pr.after.m}`);
        if (p.goal) L.push(`  יעד: ${p.goal}`);
      }
      L.push('');
    }
    L.push('כשירויות:');
    for (const r of competencyTable(S, tid, now)) {
      if (!r.n) continue;
      const arrow = r.trend.dir === 'up' ? '↑' : r.trend.dir === 'down' ? '↓' : r.trend.dir === 'flat' ? '→' : '';
      L.push(`• ${r.c.name}: ⊕${r.plus} ⊖${r.minus}${arrow ? ' ' + arrow : ''}`);
    }
    const strong = phs.filter(p => p.kind === 'strength').map(p => p.title)
      .concat(topComps(S, tid, 'plus', 2).map(x => compName(S, x.cid)));
    if (strong.length) L.push('', 'חוזקות מוכחות: ' + [...new Set(strong)].join(' · '));
    const openGaps = phs.filter(p => p.kind === 'gap' && p.status !== 'resolved').map(p => p.title);
    if (openGaps.length) L.push('נשאר פתוח: ' + openGaps.join(' · '));
    return L.join('\n').trim();
  }

  return { DAY, WIN, DEFAULT_COMPETENCIES, DEFAULT_CONDITIONS, STATUS, STATUS_ORDER, KIND,
           ts, parseISO, calDays, ymd, fmtD, fmtDY, fmtT, sym, tod, normalize, compName, obsOf, byAtDesc, countPM,
           stats, coverageOrder, trend, competencyTable, biasWarnings, patternSuggestions,
           phenomenonProgress, breakdown, lastTalk, dueFollowups, attention, topComps, prepText, summaryText };
})();

/* ======================================================================
   vault — encryption at rest. PBKDF2-SHA256 (250k) -> AES-GCM-256.
   One envelope format for both localStorage and backup files. A wrong
   password fails GCM authentication; there is no stored hash to attack.
   ====================================================================== */
const vault = (() => {
  const ITER = 250000;
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function derive(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: iter || ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  const newSalt = () => crypto.getRandomValues(new Uint8Array(16));
  async function seal(key, salt, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj))));
    return { app: 'tatzpiot', v: 1, iter: ITER, salt: b64(salt), iv: b64(iv), ct: b64(ct) };
  }
  async function open(pw, env) {
    if (!env || env.app !== 'tatzpiot' || !env.salt || !env.iv || !env.ct) throw new Error('format');
    const salt = unb64(env.salt);
    const key = await derive(pw, salt, env.iter);
    let pt;
    try { pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(env.iv) }, key, unb64(env.ct)); }
    catch (e) { throw new Error('badpw'); }
    return { key, salt, data: JSON.parse(dec.decode(pt)) };
  }
  return { ITER, derive, newSalt, seal, open };
})();

/* ---------- storage ---------- */
function persist() {
  if (DEMO || !S || !KEY) return saving;
  const key = KEY, salt = SALT;
  saving = saving
    .then(() => vault.seal(key, salt, S))
    .then(env => localStorage.setItem(LS_KEY, JSON.stringify(env)))
    .catch(e => { console.warn(e); toast('השמירה נכשלה — גבה מיד'); });
  return saving;
}
function readEnvelope() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}

/* ---------- toast / clipboard / sheet ---------- */
let toastT = 0;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('הועתק'); return; } catch (e) { /* fall through */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('הועתק'); } catch (e) { toast('ההעתקה נכשלה'); }
  ta.remove();
}
let sheetOnClose = null;
function openSheet(html, onClose) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div>${html}</div></div>`;
  sheetOnClose = onClose || null;
  requestAnimationFrame(() => { root.querySelector('.backdrop').classList.add('on'); root.querySelector('.sheet').classList.add('on'); });
}
function sheetBody(html) {
  const s = $('#sheetRoot .sheet-in');
  if (s) s.innerHTML = `<div class="grab"></div>${html}`;
}
function closeSheet() {
  const root = $('#sheetRoot');
  const sh = root.querySelector('.sheet');
  if (!sh) return;
  root.querySelector('.backdrop').classList.remove('on'); sh.classList.remove('on');
  const cb = sheetOnClose; sheetOnClose = null;
  setTimeout(() => { if (root.querySelector('.sheet') === sh) root.innerHTML = ''; }, 300);
  if (cb) cb();
}
const sheetHead = title => `<div class="sheet-h"><h2>${esc(title)}</h2><button class="ibtn" data-act="closeSheet" aria-label="סגור">${ic('x')}</button></div>`;

/* ---------- chrome ---------- */
function topBar(title, sub, opts) {
  opts = opts || {};
  const back = opts.back ? `<button class="ibtn" data-act="back" aria-label="חזרה">${ic('back')}</button>` : '';
  const right = opts.right || '';
  return `<header class="top"><div class="top-in">${back}<div class="top-t"><h1>${esc(title)}</h1>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>${right}</div></header>`;
}
function bottomNav(cur) {
  const a = (href, k, icon, label) => `<a href="${href}" aria-current="${cur === k}">${ic(icon)}<span>${label}</span></a>`;
  return `<nav class="bnav" aria-label="ניווט"><div class="bnav-in">
    ${a('#/', 'home', 'home', 'בית')}
    ${a('#/round', 'round', 'round', 'סבב')}

}
function demoBanner() {
  return DEMO ? `<div class="banner info">${ic('eye')}<div class="grow"><b>מצב הדגמה</b>נתוני דוגמה בזיכרון בלבד. שום דבר לא נשמר. <a href="#" data-act="exitDemo">יציאה</a></div></div>` : '';
}

/* ---------- router ---------- */
function parseRoute() {
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean).map(decodeURIComponent);
  return parts;
}
function render() {
  if (!S) return renderLock();
  const [r, a, b] = parseRoute();
  const app = $('#app');
  let html;
  if (r === 't' && trainee(a)) html = viewProfile(a, b || 'loop');
  else if (r === 'p' && phen(a)) html = viewPhenomenon(a);
  else if (r === 'talk' && trainee(a)) html = viewTalkForm(a);
  else if (r === 'prep' && trainee(a)) html = viewText(a, 'prep');
  else if (r === 'summary' && trainee(a)) html = viewText(a, 'summary');
  else if (r === 'round') html = viewRound();
  else if (r === 'settings') html = viewSettings();
  else html = viewHome();
  app.innerHTML = html;
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }

/* ======================================================================
   views
   ====================================================================== */
function viewHome() {
  const now = Date.now();
  const order = L.coverageOrder(S, now);
  const sd = S.settings.staleDays;
  const fresh = order.filter(x => !x.s.stale).length;
  let h = topBar(S.settings.unitName || 'תצפיות', new Date().toLocaleDateString('he-IL', { weekday: 'long', day: 'numeric', month: 'long' }),
    { right: `<button class="ibtn" data-act="lock" aria-label="נעל">${ic('lock')}</button>` });
  h += '<main class="wrap">' + demoBanner();

  if (!DEMO && S.observations.length) {
    const lb = S.settings.lastBackupAt;
    const days = lb ? L.calDays(lb, now) : null;
    if (days === null || days > 7) {
      h += `<div class="banner warn">${ic('alert')}<div class="grow"><b>${days === null ? 'עוד לא גיבית' : `לא גיבית ${days} ימים`}</b>Safari עלול למחוק נתוני אתר. הגיבוי הוא קו ההגנה היחיד.<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="exportBackup">${ic('download')}גבה עכשיו</button></div></div></div>`;
    }
  }

  if (!order.length) {
    h += `<div class="card empty" style="margin-top:16px"><div class="logo" style="margin:0 auto 12px">${ic('eye')}</div><h2 style="color:var(--ink)">מתחילים</h2><p>הוסף את החניכים שלך — כינוי או מספר, לא שם מלא.</p><a class="btn primary" href="#/settings">הוסף חניכים</a></div>`;
    return h + '</main>' + bottomNav('home');
  }

  const items = L.attention(S, now);
  if (items.length) {
    h += `<p class="eyebrow">דורש תשומת לב</p><div class="card">`;
    for (const it of items.slice(0, 6)) h += queueItem(it);
    if (items.length > 6) h += `<p class="muted small" style="margin:10px 0 0">ועוד ${items.length - 6} בפרופילים</p>`;
    h += '</div>';
  }

  h += `<p class="eyebrow">כיסוי · ${sd} ימים אחרונים</p>
    <div class="card"><div class="cov"><span class="num"><bdi><b>${fresh}</b>/${order.length}</bdi> נצפו</span><div class="track"><div class="fill" style="width:${order.length ? Math.round(100 * fresh / order.length) : 0}%"></div></div>
    ${fresh < order.length ? `<a class="btn sm ghost" href="#/round">סבב</a>` : ''}</div></div>`;

  h += `<p class="eyebrow">חניכים · מי שלא נצפה הכי מזמן למעלה</p><div class="list">`;
  for (const { t, s } of order) {
    const open = S.phenomena.filter(p => p.traineeId === t.id && p.status !== 'resolved').length;
    h += `<a class="li${s.stale ? ' stale' : ''}" href="#/t/${t.id}"><span class="bar"></span>
      <div class="grow"><div class="nm">${esc(t.nickname)}</div>
      <div class="meta"><span class="when">${ago(s.daysSince)}</span>${t.team ? ` · ${esc(t.team)}` : ''}${open ? ` · ${open} תופעות פתוחות` : ''}</div></div>
      <div class="counts num"><span class="p">⊕${s.plus}</span><span class="m">⊖${s.minus}</span><span class="muted">${s.count}</span></div>
      <span class="chev">${ic('chev')}</span></a>`;
  }
  h += '</div></main>' + bottomNav('home');
  return h;
}

function queueItem(it) {

  }
  if (it.type === 'pattern') {
    const s = it.s, cn = L.compName(S, s.competencyId);

        <button class="btn sm ghost" data-act="dismissPattern" data-t="${it.t.id}" data-c="${s.competencyId}" data-k="${s.kind}">התעלם</button></div></div></div>`;
  }
  return `<div class="q"><div class="ico r">${ic('alert')}</div><div class="grow">
    <div class="t">${esc(it.t.nickname)}</div><div class="d">${esc(it.w.text)}</div></div>

/* ---------- profile ---------- */
function viewProfile(tid, tab) {
  const t = trainee(tid), now = Date.now();
  const s = L.stats(S, tid, now);
  let h = topBar(t.nickname, [t.team, t.active === false ? 'לא פעיל' : ''].filter(Boolean).join(' · '), { back: true });
  h += '<main class="wrap">' + demoBanner();
  h += `<div class="stats num">
    <div class="stat"><b>${s.count}</b><span>תצפיות</span></div>
    <div class="stat"><b class="p">${s.plus}</b><span>⊕</span></div>
    <div class="stat"><b class="m">${s.minus}</b><span>⊖</span></div>
    <div class="stat"><b style="${s.stale ? 'color:var(--stale)' : ''}">${s.daysSince === null ? '—' : s.daysSince}</b><span>ימים מאז</span></div>
  </div>`;
  for (const w of L.biasWarnings(S, tid)) h += `<div class="banner alert">${ic('alert')}<div class="grow">${esc(w.text)}</div></div>`;
  const pats = L.patternSuggestions(S, tid, now);
  for (const p of pats) h += queueItemBanner(t, p);

  const tabs = [['loop', 'מעגל'], ['comp', 'כשירויות'], ['time', 'ציר זמן'], ['talks', 'שיחות']];
  h += `<nav class="tabs">${tabs.map(([k, l]) => `<a class="tab" href="#/t/${tid}/${k}" aria-current="${tab === k}">${l}</a>`).join('')}</nav>`;
  if (tab === 'comp') h += tabComp(tid, now);
  else if (tab === 'time') h += tabTime(tid);
  else if (tab === 'talks') h += tabTalks(tid);
  else h += tabLoop(tid);
  return h + '</main>' + bottomNav('');
}
function queueItemBanner(t, s) {
  const ex = s.existingId ? phen(s.existingId) : null;
  return `<div class="banner info">${ic('target')}<div class="grow"><b>נראה דפוס ב"${esc(L.compName(S, s.competencyId))}"</b>${s.obsIds.length} תצפיות ${s.kind === 'gap' ? '⊖' : '⊕'} ב-14 יום שלא מקושרות לתופעה.
    <div class="btns" style="margin-top:8px">${ex
      ? `<button class="btn sm" data-act="linkPattern" data-t="${t.id}" data-c="${s.competencyId}" data-k="${s.kind}">קשר ל"${esc(ex.title)}"</button>`

    <button class="btn sm ghost" data-act="dismissPattern" data-t="${t.id}" data-c="${s.competencyId}" data-k="${s.kind}">התעלם</button></div></div></div>`;
}

function phCard(p) {
  const ev = S.observations.filter(o => (o.phenomenonIds || []).includes(p.id)).length;
  const pr = L.phenomenonProgress(S, p);
  const good = p.kind === 'gap' ? 'm' : 'p';

    <div class="row"><span class="k ${p.kind}">${L.KIND[p.kind]}</span><span class="badge">${L.STATUS[p.status]}</span><span class="grow"></span><span class="muted small">${ev} ראיות</span></div>
    <div class="title">${esc(p.title)}</div>
    <div class="muted small">${esc(L.compName(S, p.competencyId))}${p.goal ? ` · יעד: ${esc(p.goal)}` : ''}</div>
    ${pr ? `<div class="prog num"><span class="muted">לפני השיחה</span><span class="p">⊕${pr.before.p}</span><span class="m">⊖${pr.before.m}</span><span class="arrow">←</span><span class="muted">מאז</span><span class="p">⊕${pr.after.p}</span><span class="m">⊖${pr.after.m}</span></div>` : ''}
  </a>`;

function tabLoop(tid) {
  let h = `<div class="btns" style="margin-top:14px">
    <button class="btn" data-act="newPhen" data-t="${tid}">${ic('target')}תופעה</button>
    <a class="btn" href="#/talk/${tid}">${ic('talk')}שיחת משוב</a></div>`;
  const all = S.phenomena.filter(p => p.traineeId === tid);
  const open = all.filter(p => p.status !== 'resolved')
    .sort((a, b) => L.STATUS_ORDER.indexOf(b.status) - L.STATUS_ORDER.indexOf(a.status));
  const done = all.filter(p => p.status === 'resolved');
  const t = trainee(tid);
  if (!all.length) {
    h += `<div class="card empty" style="margin-top:12px">${ic('target')}<p>עוד אין תופעות.<br>תופעה = דפוס התנהגות חוזר שראית יותר מפעם אחת. כשיצטברו 3 תצפיות דומות — הכלי יציע לאפיין.</p></div>`;
  } else {
    h += `<p class="eyebrow">תופעות פתוחות</p>`;
    h += open.length ? open.map(phCard).join('') : `<p class="muted">אין תופעות פתוחות.</p>`;
    if (done.length) h += `<details class="more"><summary>הושגו (${done.length})</summary>${done.map(phCard).join('')}</details>`;
  }
  // what to look for next — the targeted-observation step of the loop
  const look = open.filter(p => p.status !== 'identified');
  if (look.length) {
    h += `<p class="eyebrow">מה לחפש בתצפית הבאה על ${esc(t.nickname)}</p><div class="card">${look.map(p => `<div class="row" style="padding:4px 0">${ic('eye')}<span class="grow">${esc(p.goal || p.title)}</span></div>`).join('')}</div>`;
  }
  const k = L.lastTalk(S, tid);
  if (k) {
    h += `<p class="eyebrow">שיחה אחרונה · ${L.fmtDY(k.at)}</p><div class="card">
      ${k.agreements ? `<div><b>סוכם:</b> ${esc(k.agreements)}</div>` : ''}
      ${k.followUpAt ? `<div class="muted small" style="margin-top:4px">מעקב: ${L.fmtDY(k.followUpAt)}${k.followUpDone ? ' · בוצע' : ''}</div>` : ''}</div>`;
  }
  return h;
}

function trendHTML(tr) {
  if (!tr.dir) return `<span class="muted small">אין מספיק נתונים</span>`;
  const r = tr.recent, q = tr.prev;
  const icon = tr.dir === 'up' ? 'up' : tr.dir === 'down' ? 'down' : 'flat';
  // Fractions are isolated with <bdi>: an inline "a/b→c/d" gets reordered by
  // the RTL bidi pass and reads backwards (now→before).
  return `<span class="trend ${tr.dir}">${ic(icon)}<span class="num">עכשיו <bdi>${r.p}/${r.p + r.m}</bdi><span class="was">קודם <bdi>${q.p}/${q.p + q.m}</bdi></span></span></span>`;
}
function tabComp(tid, now) {
  const rows = L.competencyTable(S, tid, now);
  let h = `<div class="card" style="margin-top:14px"><table class="ct"><thead><tr><th>כשירות</th><th class="p">⊕</th><th class="m">⊖</th><th>מגמה</th></tr></thead><tbody>`;
  for (const r of rows) {
    h += `<tr class="${r.n ? '' : 'none'}" data-act="filterComp" data-t="${tid}" data-c="${r.c.id}"><td>${esc(r.c.name)}</td>
      <td class="n num p">${r.plus || '·'}</td><td class="n num m">${r.minus || '·'}</td>
      <td class="tr">${r.n ? trendHTML(r.trend) : '<span class="muted">—</span>'}</td></tr>`;
  }
  h += `</tbody></table></div><p class="muted small" style="margin:10px 2px">מגמה = חלק ה-⊕ מתוך ⊕/⊖ ב-21 הימים האחרונים ("עכשיו") לעומת 21 הימים שלפניהם ("קודם"). מוצגת רק כשיש לפחות 3 תצפיות ⊕/⊖ בכל תקופה. ⊕/⊖ הם ספירה, לא ציון.</p>`;
  return h;
}

function tabTime(tid) {
  const comps = S.settings.competencies;
  const chip = (k, l) => `<button class="chip sm" data-act="timeFilter" data-k="${k}" aria-pressed="${timeFilter === k}">${esc(l)}</button>`;
  let h = `<div class="chips scroll" style="margin-top:14px">${chip('all', 'הכל')}${chip('notes', 'הערות')}${chip('talks', 'שיחות')}${comps.map(c => chip(c.id, c.name)).join('')}</div>`;
  const ev = [];
  if (timeFilter === 'all' || (timeFilter !== 'notes' && timeFilter !== 'talks')) {
    for (const o of L.obsOf(S, tid)) if (timeFilter === 'all' || o.competencyId === timeFilter) ev.push({ k: 'o', at: o.at, o });
  }
  if (timeFilter === 'all' || timeFilter === 'notes') for (const n of S.notes) if (n.traineeId === tid) ev.push({ k: 'n', at: n.at, n });
  if (timeFilter === 'all' || timeFilter === 'talks') for (const k of S.talks) if (k.traineeId === tid) ev.push({ k: 't', at: k.at, t: k });

  for (const e of ev) h += e.k === 'o' ? obsHTML(e.o, true) : e.k === 'n' ? noteHTML(e.n) : talkHTML(e.t, true);
  return h + '</div>';

  }

    h += `<p class="eyebrow">אפיון · מתי זה קורה</p><div class="card">${bd.insights.map(x => `<div class="insight"><b>${x.c} מתוך ${x.n}</b> ${x.kind === 'cond' ? 'בתנאי' : x.kind === 'tod' ? 'ב' : 'ב'}${esc(x.label)}</div>`).join('')}

function sheetObsHTML() {

// Two independent drafts: the "+" sheet and the exercise round. Opening the
// sheet mid-round must never wipe what was typed into the round form.
const sheetOpen = () => !!$('#sheetRoot .sheet');
function cur() { return sheetOpen() && draft ? draft : round && round.draft ? round.draft : draft; }
function rerenderDraft() {
  if (sheetOpen() && draft) sheetBody(sheetObsHTML());
  else if (round && round.draft) { const f = $('#obsForm'); if (f) f.innerHTML = obsFormHTML(round.draft, { compact: true }); }
}
function openObsSheet(opts) {
  draft = newDraft(opts);
  openSheet(sheetObsHTML(), () => { draft = null; });
}
function validateDraft(d) {
  if (!d.traineeId) return 'בחר חניך';
  if (d.mode === 'note') return d.text.trim() ? '' : 'ההערה ריקה';
  if (!d.competencyId) return 'בחר כשירות';
  if (!d.valence) return 'בחר ⊕ / ⊖ / ניטרלי';
  if (!d.behavior.trim()) return 'חובה לתאר מה הוא עשה';
  return '';
}
function commitDraft(d) {
  const at = d.at ? new Date(d.at).toISOString() : nowISO();
  if (d.mode === 'note') {
    S.notes.push({ id: uid(), traineeId: d.traineeId, at, text: d.text.trim(), private: !!d.private, createdAt: nowISO() });
    return;
  }
  const rec = { traineeId: d.traineeId, exerciseId: d.exerciseId || null, at, competencyId: d.competencyId, valence: d.valence,
    situation: d.situation.trim(), behavior: d.behavior.trim(), impact: d.impact.trim(), location: d.location.trim() || null,
    conditions: d.conditions.slice(), phenomenonIds: d.phenomenonIds.slice() };
  if (d.editId) {
    const o = S.observations.find(x => x.id === d.editId);
    if (o) Object.assign(o, rec);
  } else S.observations.push({ id: uid(), ...rec, createdAt: nowISO() });
}

async function doUnlock(pw) {
  const env = readEnvelope();
  const btn = $('#go'); if (btn) { btn.disabled = true; btn.textContent = 'פותח…'; }
  try {
    const r = await vault.open(pw, env);
    S = L.normalize(r.data); KEY = r.key; SALT = r.salt; DEMO = false;
    lastAct = Date.now();
    render();
  } catch (e) {
    renderLock(e.message === 'badpw' ? 'סיסמה שגויה' : 'הנתונים פגומים');
  }
}
async function doSetup(unit, pw1, pw2) {
  if (pw1.length < 6) return renderLock('סיסמה קצרה מדי (לפחות 6 תווים)');
  if (pw1 !== pw2) return renderLock('הסיסמאות לא תואמות');
  const btn = $('#go'); if (btn) { btn.disabled = true; btn.textContent = 'מצפין…'; }
  SALT = vault.newSalt(); KEY = await vault.derive(pw1, SALT);
  S = L.normalize({ settings: { unitName: unit.trim() } }); DEMO = false;
  await persist();
  location.hash = '#/settings';
  render();
  toast('הכספת נוצרה. הוסף חניכים.');
}
async function lock() {
  if (!S) return;
  await saving;
  S = null; KEY = null; SALT = null; DEMO = false; draft = null; round = null;
  render();
}

/* ======================================================================
   backup / restore / password
   ====================================================================== */
async function exportBackup() {
  if (DEMO || !KEY) return;
  const prev = S.settings.lastBackupAt;
  S.settings.lastBackupAt = nowISO();
  const env = await vault.seal(KEY, SALT, S);
  env.exportedAt = S.settings.lastBackupAt;
  const name = `tatzpiot-backup-${todayYMD()}.json`;
  const blob = new Blob([JSON.stringify(env)], { type: 'application/json' });
  let ok = false;
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      ok = true;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') { S.settings.lastBackupAt = prev; return; }
  }
  if (!ok) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  await persist(); render(); toast('הגיבוי נוצר');
}
let restoreEnv = null;
function onRestoreFile(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try { restoreEnv = JSON.parse(fr.result); if (!restoreEnv || restoreEnv.app !== 'tatzpiot') throw 0; }
    catch (e) { toast('זה לא קובץ גיבוי של תצפיות'); restoreEnv = null; return; }
    openSheet(sheetHead('שחזור מגיבוי') + `<form data-form="restore">
      <p class="muted" style="margin:0">${restoreEnv.exportedAt ? `גיבוי מ-${L.fmtDY(restoreEnv.exportedAt)}. ` : ''}הזן את הסיסמה שהייתה בזמן הגיבוי.</p>
      <label class="f" for="rpw">סיסמת הגיבוי</label><input type="password" id="rpw" autocomplete="current-password">
      ${S ? `<div class="banner alert">${ic('alert')}<div class="grow">השחזור <b>מחליף</b> את כל הנתונים הנוכחיים במכשיר.</div></div>` : ''}
      <div class="err hidden" id="rerr"></div>
      <div class="btns" style="margin-top:14px"><button class="btn primary block" type="submit" id="rgo">שחזר</button></div></form>`);
  };
  fr.readAsText(file);
}
async function doRestore(pw) {
  const btn = $('#rgo'); if (btn) { btn.disabled = true; btn.textContent = 'מפענח…'; }
  try {
    const r = await vault.open(pw, restoreEnv);
    S = L.normalize(r.data); KEY = r.key; SALT = r.salt; DEMO = false; round = null;
    await persist();
    closeSheet(); location.hash = '#/'; render();
    toast('שוחזר. הסיסמה עכשיו היא סיסמת הגיבוי.');
  } catch (e) {
    const er = $('#rerr'); if (er) { er.textContent = e.message === 'badpw' ? 'סיסמה שגויה או קובץ פגום' : 'קובץ פגום'; er.classList.remove('hidden'); }
    if (btn) { btn.disabled = false; btn.textContent = 'שחזר'; }
  }
}

async function doChangePw(p0, p1, p2) {

  try { await vault.open(p0, readEnvelope()); } catch (e) { return fail('הסיסמה הנוכחית שגויה'); }

function wipe() {

  // [trainee, daysAgo, hour, comp, valence, behavior, situation, conditions, location, exercise, phenomena]

  openSheet(sheetHead('תופעה חדשה · ' + trainee(tid).nickname) + `
    <div class="seg" id="phKindSeg" role="group"><button data-act="phKind" data-v="gap" aria-pressed="${kind === 'gap'}">לשיפור</button><button data-act="phKind" data-v="strength" aria-pressed="${kind === 'strength'}">חוזקה</button></div>
    ${obsList.length ? `<label class="f">התצפיות שיקושרו</label><div class="card" style="box-shadow:none">${obsList.map(o => obsHTML(o, false)).join('')}</div>
      ${bd.insights.length ? bd.insights.map(x => `<div class="insight"><b>${x.c} מתוך ${x.n}</b> ב${esc(x.label)}</div>`).join('') : ''}` : ''}
    <label class="f">כשירות</label><div class="chips" id="phCompChips">${comps.map(c => `<button class="chip sm" data-act="phComp" data-id="${c.id}" aria-pressed="${s && s.competencyId === c.id}">${esc(c.name)}</button>`).join('')}</div>
    <label class="f" for="npTitle">ניסוח — התנהגות חוזרת, לא תכונה</label>
    <input type="text" id="npTitle" placeholder="&quot;כש... הוא...&quot; — לדוגמה: מעכב החלטה כשהתוכנית משתנה">
    <label class="f" for="npGoal">יעד <span class="muted">(אופציונלי — אפשר לקבוע בשיחה)</span></label>
    <textarea id="npGoal" rows="2" placeholder="מה תראה כשזה ישתפר"></textarea>
    <div class="err hidden" id="nperr"></div>
    <div class="save-bar"><button class="btn primary block" data-act="savePhen" data-t="${tid}" data-obs="${obsList.map(o => o.id).join(',')}">צור תופעה</button></div>`);
}
function roundDraft() {
  if (!round || round.i >= round.queue.length) return null;
  return newDraft({ traineeId: round.queue[round.i], exerciseId: round.exerciseId });
}
function beginRound(exId) {
  const queue = L.coverageOrder(S, Date.now()).map(x => x.t.id);
  round = { exerciseId: exId, queue, i: 0, done: [], count: 0, draft: null };
  round.draft = roundDraft();
  go('#/round'); render();
}
function roundCommit(advance) {
  const d = round.draft;
  const e = validateDraft(d);
  if (e) { d.err = e; rerenderDraft(); return; }
  commitDraft(d); persist();
  const tid = d.traineeId;
  if (!round.done.includes(tid)) round.done.push(tid);
  round.count++;
  toast(`נשמר · ${trainee(tid).nickname}`);
  if (advance) round.i++;
  round.draft = roundDraft();
  render(); window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = A[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target, d = cur();
  if (d && el.dataset.bind) {
    d[el.dataset.bind] = el.value;
    if (el.dataset.bind === 'behavior') {
      const h = el.parentElement.querySelector('#obHint'), n = el.value.trim().length;
      if (h) h.hidden = !(n > 0 && n < 15);
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target, d = cur();
  if (d && el.dataset.bindCheck) { d[el.dataset.bindCheck] = el.checked; return; }
  if (d && el.dataset.bind === 'exerciseId') { d.exerciseId = el.value || null; return; }
  if (!S) { if (el.id === 'restoreFile' && el.files[0]) onRestoreFile(el.files[0]); return; }
  if (el.id === 'restoreFile' && el.files[0]) { onRestoreFile(el.files[0]); return; }
  if (el.dataset.set) {
    const k = el.dataset.set;
    if (k === 'staleDays') { const v = Math.max(1, Math.min(60, Number(el.value) || 5)); S.settings.staleDays = v; }
    else if (k === 'bgLockSec') S.settings.bgLockSec = Number(el.value);
    else S.settings[k] = el.value.trim();
    persist(); return;
  }
  if (el.dataset.tr) {
    const t = trainee(el.dataset.tr); if (!t) return;
    if (el.dataset.f === 'active') t.active = el.checked;
    else if (el.dataset.f === 'nickname') { if (el.value.trim()) t.nickname = el.value.trim(); else el.value = t.nickname; }
    else t[el.dataset.f] = el.value.trim();
    persist(); return;
  }
  if (el.dataset.comp) {
    const c = S.settings.competencies.find(x => x.id === el.dataset.comp);
    if (c && el.value.trim()) { c.name = el.value.trim(); persist(); } else if (c) el.value = c.name;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if (!f) return;
  e.preventDefault();
  if (f === 'unlock') doUnlock($('#pw').value);
  else if (f === 'setup') doSetup($('#unit').value, $('#pw1').value, $('#pw2').value);
  else if (f === 'restore') doRestore($('#rpw').value);
  else if (f === 'changePw') doChangePw($('#cp0').value, $('#cp1').value, $('#cp2').value);
  else if (f === 'wipe') {
    if ($('#wipeTxt').value.trim() !== 'מחק') { toast('הקלד "מחק" בדיוק'); return; }
    localStorage.removeItem(LS_KEY);
    S = null; KEY = null; SALT = null; closeSheet(); location.hash = '#/'; render(); toast('הכל נמחק');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- auto-lock ---------- */
['pointerdown', 'keydown', 'input'].forEach(ev => document.addEventListener(ev, () => { lastAct = Date.now(); }, { passive: true, capture: true }));
setInterval(() => { if (S && Date.now() - lastAct > 5 * 60e3) lock(); }, 15e3);
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.hidden) {
    hiddenAt = Date.now();
    if (S.settings.bgLockSec === 0) lock();
  } else {
    const away = hiddenAt ? Date.now() - hiddenAt : 0;
    hiddenAt = null;
    if (away >= S.settings.bgLockSec * 1000 || Date.now() - lastAct > 5 * 60e3) lock();
  }
});

render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () =>
    navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
